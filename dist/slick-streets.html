// Simulation owner. Holds the world and steps it; produces `events` that the
// presentation layer turns into sound and screen shake. No DOM in here.







const MAX_HEALTH = 100;
const CROWD_RADIUS = 82;
const CROWD_NORM = 15;      // enemies-worth of pressure that counts as "mobbed"
const GRAB_SOFT_CAP = 22;   // asymptotic ceiling on damage per second
const REGEN_DELAY = 4.0;
const REGEN_RATE = 3.0;
const COMBO_WINDOW = 1.4;
const RAMP_SECONDS = 260;   // time to reach maximum horde density

const MAX_PARTICLES = 1400;

/** Chance per second that any one enemy touching the wire is shredded by it. */
const WIRE_SHRED_RATE = 0.9;
/** Anything busy tearing itself open on the wire is not clawing at you. */
const WIRE_DAMAGE_SCALE = 0.5;
/** How much wider the big wheels make the crushing footprint. */
const WHEEL_WIDTH_SCALE = 1.75;
/** Flamethrower: seconds between bursts, and how long each burst sprays. */
const FLAME_GAP = [3, 5];
const FLAME_SPRAY = 0.6;
const FLAME_RANGE = 205;
const FLAME_HALF_ANGLE = 0.44;

/** How much wet blood each kind of kill pours onto the road. */
const BLOOD_PER_KILL = [0.3, 0.1, 0];   // meat, bone, charred
/** Wet blood depth that counts as a fully slick road. */
const SLIP_SCALE = 1.25;
/** Distance between tyre marks laid down while the tyres are bloody. */
const TRACK_SPACING = 9;
/**
 * The renderer bakes these and clears them. Cap them so a headless run - or a
 * frame where the simulation steps several times before one draw - cannot let
 * them grow without bound.
 */
const MAX_PENDING_MARKS = 512;

class Game {
  constructor(seed = Date.now()) {
    this.seed = seed >>> 0;
    this.particles = new Array(MAX_PARTICLES);
    for (let i = 0; i < MAX_PARTICLES; i++) {
      this.particles[i] = { live: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, kind: 0, tone: 0 };
    }
    this.pHead = 0;
    this.events = [];
    this._q = [];
    this._tmp = { x: 0, y: 0 };
    this._hit = { nx: 0, ny: 0, depth: 0 };
    this.bestScore = 0; // set by the host from local storage; survives resets
    this.reset(this.seed);
  }

  reset(seed = this.seed) {
    this.seed = seed >>> 0;
    this.rng = mulberry32(this.seed ^ 0x9e3779b9);
    this.city = generateCity(this.seed, 40, 40);
    this.swarm = new Swarm(this.city, this.seed);
    this.gore = new GoreField(this.seed);
    this.pickups = new PickupField(this.city, this.seed);
    this.blood = new BloodField();

    // Start on an intersection near the middle of the map.
    const c = this.city.cell;
    const gx = Math.floor(this.city.cols / 2) * c;
    const gy = Math.floor(this.city.rows / 2) * c;
    this.car = createCar(gx, gy, -Math.PI / 2);
    this.car.gear = GEAR_HIGH;
    this.blood.anchor(gx, gy);

    this.state = 'title';
    this.time = 0;
    this.health = MAX_HEALTH;
    this.kills = 0;
    this.zombieKills = 0;
    this.skeletonKills = 0;
    this.distance = 0;
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.bestCombo = 0;
    this.crowd = 0;
    this.goreDrag = 0;
    this.grabbers = 0;
    this.hurtTimer = 0;
    this.shake = 0;
    this.deathCause = '';
    // Seconds remaining on each vehicle upgrade, indexed by pickup kind.
    this.power = [0, 0, 0];
    this.flameCooldown = 0;
    this.flameSpray = 0;
    this.lastPickup = -1;
    this.lastPickupAge = 99;
    this.shredKills = 0;
    this.burnKills = 0;
    this._collected = [];
    this.slip = 0;
    this.trackDist = 0;
    this.fluidTick = 0;
    /** Tyre marks waiting to be baked into the permanent stains. */
    this.marks = [];
    for (const p of this.particles) p.live = false;
    this.events.length = 0;
    this._seedAttractHorde();
  }

  /**
   * Fill the streets around the parked car for the title screen. Ordinary
   * spawning happens out beyond the edge of the view, which would leave the
   * menu looking like an empty city for the first few seconds.
   */
  _seedAttractHorde() {
    const { car, rng } = this;
    for (let i = 0; i < 320; i++) {
      const a = rng() * TAU;
      const d = 220 + Math.sqrt(rng()) * 900;
      const x = car.x + Math.cos(a) * d;
      const y = car.y + Math.sin(a) * d;
      if (isBlocked(this.city, x, y, 10)) continue;
      this.swarm.spawn(x, y, rng() < 0.2 ? SKELETON : ZOMBIE);
    }
  }

  start() {
    if (this.state === 'playing') return;
    if (this.state === 'dead') this.reset((Math.random() * 0xffffffff) >>> 0);
    // The attract-mode horde has been converging on a parked car; clear it so
    // every run starts with room to get moving rather than already buried.
    this.swarm.reset();
    this.gore.reset();
    this.blood.reset();
    this.marks.length = 0;
    this.state = 'playing';
    this.events.push({ type: 'start' });
  }

  /** True while the given pickup kind is active. */
  has(kind) {
    return this.power[kind] > 0;
  }

  /** How wide a path the car currently crushes, in body widths. */
  get crushWidth() {
    return this.has(WHEELS) ? WHEEL_WIDTH_SCALE : 1;
  }

  get difficulty() {
    return clamp(this.time / RAMP_SECONDS, 0, 1);
  }

  emitParticle(x, y, vx, vy, life, size, kind, tone) {
    const p = this.particles[this.pHead];
    this.pHead = (this.pHead + 1) % MAX_PARTICLES;
    p.live = true;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = life; p.max = life; p.size = size; p.kind = kind; p.tone = tone;
  }

  shiftTo(gear) {
    if (this.state !== 'playing' || this.car.gear === gear) return;
    this.car.gear = gear;
    this.events.push({ type: 'shift', gear });
  }

  toggleGear() {
    if (this.state !== 'playing') return;
    this.events.push({ type: 'shift', gear: toggleGear(this.car) });
  }

  /** Kill one enemy, spray the matching gore, and bank the score for it. */
  killEnemy(e, dirx, diry, power, goreKind, amount) {
    const k = KINDS[e.kind];
    this.gore.burst(e.x, e.y, dirx, diry, power, goreKind, amount);
    const wet = BLOOD_PER_KILL[goreKind];
    if (wet > 0) {
      // Thrown along the direction of the hit, so it sprays rather than pools.
      this.blood.add(e.x, e.y, wet, dirx * power * 0.45, diry * power * 0.45, 24);
    }
    this.swarm.kill(e);
    this.kills++;
    if (e.kind === ZOMBIE) this.zombieKills++; else this.skeletonKills++;
    this.combo++;
    this.comboTimer = COMBO_WINDOW;
    if (this.combo > this.bestCombo) this.bestCombo = this.combo;
    this.score += Math.round(10 * (1 + Math.min(this.combo, 40) * 0.05));
    return k;
  }

  /**
   * Everything the tyres do to the wet blood: drag it about, pick it up, and
   * lay it back down as tracks. This is what carves a legible path through a
   * pool and what a burnout throws everywhere.
   */
  tyres(dt) {
    const car = this.car;
    const blood = this.blood;
    const cos = Math.cos(car.ang);
    const sin = Math.sin(car.ang);
    const speed = Math.hypot(car.vx, car.vy);
    const spin = car.wheelspin;
    const wet = this.slip;
    const halfW = CAR_WIDTH * 0.5;

    // Front and rear, left and right.
    const wheels = [
      [CAR_LENGTH * 0.30, -halfW], [CAR_LENGTH * 0.30, halfW],
      [-CAR_LENGTH * 0.30, -halfW], [-CAR_LENGTH * 0.30, halfW],
    ];

    let picked = 0;
    for (let i = 0; i < wheels.length; i++) {
      const [lx, ly] = wheels[i];
      const wx = car.x + cos * lx - sin * ly;
      const wy = car.y + sin * lx + cos * ly;
      const rear = i >= 2;

      if (wet > 0.01) {
        // Drag whatever the tyre is standing in along with the car.
        if (speed > 18) blood.addVelocity(wx, wy, car.vx * 0.5, car.vy * 0.5, 14);
        picked += blood.take(wx, wy, 0.16 + spin * 0.3, 13);
      }

      // A spinning rear wheel throws blood backwards in a rooster tail.
      if (rear && spin > 0.2) {
        const throwSpeed = 120 + spin * 520;
        const jitter = rr(this.rng, -0.5, 0.5);
        const a = car.ang + Math.PI + jitter;
        blood.addVelocity(wx, wy, Math.cos(a) * throwSpeed, Math.sin(a) * throwSpeed, 17);

        if (wet > 0.04) {
          for (let s = 0; s < 2; s++) {
            const pa = car.ang + Math.PI + rr(this.rng, -0.7, 0.7);
            const sp = rr(this.rng, 90, 380) * spin;
            this.emitParticle(wx, wy, Math.cos(pa) * sp + car.vx, Math.sin(pa) * sp + car.vy,
              rr(this.rng, 0.3, 0.75), rr(this.rng, 2, 5), 0, this.rng());
          }
        }
        // Tyre smoke, blood or no blood.
        if (this.rng() < 0.7) {
          this.emitParticle(wx, wy, rr(this.rng, -50, 50) + car.vx * 0.3,
            rr(this.rng, -50, 50) + car.vy * 0.3,
            rr(this.rng, 0.5, 1.2), rr(this.rng, 5, 11), 4, this.rng());
        }
      }
    }

    car.tyreBlood = clamp(car.tyreBlood + picked * 2.6 - dt * 0.28, 0, 1);

    // Lay tracks at a fixed spacing along the ground, not per frame, so they
    // do not bunch up when slow or leave gaps when quick.
    this.trackDist += speed * dt;
    const laying = car.tyreBlood > 0.02 || spin > 0.25;
    if (laying && (this.trackDist >= TRACK_SPACING || spin > 0.25)) {
      this.trackDist = 0;
      const strength = clamp(car.tyreBlood * 0.9 + spin * 0.5, 0.08, 1);
      for (let i = 2; i < 4; i++) {
        const [lx, ly] = wheels[i];
        this.marks.push({
          x: car.x + cos * lx - sin * ly,
          y: car.y + sin * lx + cos * ly,
          ang: car.ang,
          w: 15 + spin * 12,
          h: 8 + spin * 5,
          a: strength * (0.3 + spin * 0.45),
          blood: clamp(car.tyreBlood * 1.3 + wet, 0, 1),
        });
      }
      car.tyreBlood = Math.max(0, car.tyreBlood - 0.035);
      if (this.marks.length > MAX_PENDING_MARKS) {
        this.marks.splice(0, this.marks.length - MAX_PENDING_MARKS);
      }
    }
  }

  /** The flamethrower's cone, swept every frame while it is spraying. */
  burn(dt) {
    const car = this.car;
    const cos = Math.cos(car.ang);
    const sin = Math.sin(car.ang);
    const mx = car.x + cos * CAR_LENGTH * 0.5;
    const my = car.y + sin * CAR_LENGTH * 0.5;

    const q = this.swarm.query(mx + cos * FLAME_RANGE * 0.5, my + sin * FLAME_RANGE * 0.5,
      FLAME_RANGE, this._q);
    for (let i = 0; i < q.length; i++) {
      const e = q[i];
      if (!e.alive) continue;
      const dx = e.x - mx;
      const dy = e.y - my;
      const d = Math.hypot(dx, dy);
      if (d > FLAME_RANGE) continue;
      // Inside the cone? Everything close to the muzzle counts.
      if (d > 26 && (dx * cos + dy * sin) / d < Math.cos(FLAME_HALF_ANGLE)) continue;
      this.killEnemy(e, dx / (d || 1), dy / (d || 1), 120, CHAR, 5);
      this.burnKills++;
      this.events.push({ type: 'kill', x: e.x, y: e.y, kind: e.kind, speed: 0, burned: true });
      for (let s2 = 0; s2 < 3; s2++) {
        this.emitParticle(e.x, e.y, rr(this.rng, -60, 60), rr(this.rng, -60, 60),
          rr(this.rng, 0.3, 0.7), rr(this.rng, 2, 5), 3, this.rng());
      }
    }

    // The spray itself.
    const jets = 7;
    for (let i = 0; i < jets; i++) {
      const a = car.ang + rr(this.rng, -FLAME_HALF_ANGLE, FLAME_HALF_ANGLE);
      const sp = rr(this.rng, 260, 620);
      this.emitParticle(
        mx + rr(this.rng, -4, 4), my + rr(this.rng, -4, 4),
        Math.cos(a) * sp + car.vx * 0.5, Math.sin(a) * sp + car.vy * 0.5,
        rr(this.rng, 0.22, 0.5), rr(this.rng, 3, 7), 3, this.rng(),
      );
      if (this.rng() < 0.4) {
        this.emitParticle(
          mx + Math.cos(a) * 60, my + Math.sin(a) * 60,
          Math.cos(a) * sp * 0.3 + rr(this.rng, -40, 40),
          Math.sin(a) * sp * 0.3 + rr(this.rng, -40, 40),
          rr(this.rng, 0.5, 1.1), rr(this.rng, 4, 9), 4, this.rng(),
        );
      }
    }
  }

  update(dt, input) {
    this.events.length = 0;
    if (this.state !== 'playing') {
      // Keep the horde milling around behind the menus so it never looks static.
      this.swarm.update(dt, this.car, 0.08);
      this.gore.update(dt);
      this.fluidTick ^= 1;
      if (this.fluidTick === 0) this.blood.step(dt * 2);
      this.shake *= Math.exp(-4 * dt);
      return;
    }

    this.time += dt;
    const car = this.car;
    const px = car.x;
    const py = car.y;

    // Upgrades run down, and driving over a crate tops one back up.
    for (let i = 0; i < this.power.length; i++) {
      if (this.power[i] > 0) this.power[i] = Math.max(0, this.power[i] - dt);
    }
    this.lastPickupAge += dt;
    this.pickups.update(dt, car, this._collected);
    for (const kind of this._collected) {
      this.power[kind] = PICKUP_KINDS[kind].duration;
      this.lastPickup = kind;
      this.lastPickupAge = 0;
      // Fire the first burst almost at once, so picking it up feels like something.
      if (kind === FLAME) this.flameCooldown = Math.min(this.flameCooldown, 0.5);
      this.events.push({ type: 'pickup', kind });
    }

    // ---- wet blood -------------------------------------------------------
    this.blood.anchor(car.x, car.y);
    this.slip = clamp(this.blood.sample(car.x, car.y) * SLIP_SCALE, 0, 1);

    this.swarm.update(dt, car, this.difficulty);

    // ---- run them over ------------------------------------------------
    const speed = Math.abs(car.speed);
    const q = this.swarm.query(car.x, car.y, CROWD_RADIUS, this._q);
    let crowd = 0;
    let grabDamage = 0;
    let grabbers = 0;
    let killsThisFrame = 0;
    let massKilled = 0;

    const cos = Math.cos(car.ang);
    const sin = Math.sin(car.ang);

    const crushWidth = this.crushWidth;
    const wired = this.has(WIRE);

    for (let i = 0; i < q.length; i++) {
      const e = q[i];
      if (!e.alive) continue;
      const dx = e.x - car.x;
      const dy = e.y - car.y;
      const d = Math.hypot(dx, dy);
      const k = KINDS[e.kind];

      if (d < CROWD_RADIUS) {
        crowd += (1 - d / CROWD_RADIUS) * k.drag;
      }

      // The wide footprint decides what gets crushed; only what is actually
      // against the bodywork can grab you or catch on the wire.
      if (!overlapsCar(car, e.x, e.y, e.r, crushWidth)) continue;

      if (speed >= k.killSpeed) {
        // Splat. Throw the gore forward along the car's heading.
        const dirx = car.vx / (speed || 1);
        const diry = car.vy / (speed || 1);
        this.killEnemy(e, dirx, diry, speed, e.kind === ZOMBIE ? MEAT : BONE, k.gore);
        for (let s = 0; s < 8; s++) {
          this.emitParticle(
            e.x, e.y,
            dirx * rr(this.rng, 40, 380) + rr(this.rng, -120, 120),
            diry * rr(this.rng, 40, 380) + rr(this.rng, -120, 120),
            rr(this.rng, 0.25, 0.7), rr(this.rng, 1.5, 5),
            e.kind === ZOMBIE ? 0 : 1, this.rng(),
          );
        }
        killsThisFrame++;
        massKilled += k.mass;
        this.shake = Math.min(this.shake + 0.5 + speed * 0.004, 9);
        this.events.push({ type: 'kill', x: e.x, y: e.y, kind: e.kind, speed });
      } else if (overlapsCar(car, e.x, e.y, e.r)) {
        if (wired && this.rng() < WIRE_SHRED_RATE * dt) {
          // Caught on the barbed wire and torn apart against the bodywork.
          const inv = 1 / (d || 1);
          this.killEnemy(e, dx * inv, dy * inv, 90, MEAT, 6);
          this.shredKills++;
          this.events.push({ type: 'kill', x: e.x, y: e.y, kind: e.kind, speed, shredded: true });
        } else {
          // Too slow to kill it - now it is clawing at the doors.
          const bite = clamp(1 - speed / k.killSpeed, 0, 1);
          grabDamage += k.damage * bite * (wired ? WIRE_DAMAGE_SCALE : 1);
          grabbers++;
        }
      }
    }

    if (killsThisFrame > 0) {
      // Bodies cost you momentum: ploughing a wall of them bleeds speed.
      const drop = clamp(1 - 0.006 * massKilled, 0.7, 1);
      car.vx *= drop;
      car.vy *= drop;
      car.speed *= drop;
      this.swarm.knockback(car.x, car.y, 70, 90 + speed * 0.3);
    }

    this.crowd = clamp(crowd / CROWD_NORM, 0, 1.25);
    this.grabbers = grabbers;

    // ---- drive ---------------------------------------------------------
    updateCar(car, input, dt, { crowd: this.crowd, gore: this.goreDrag, slip: this.slip });

    // ---- walls ----------------------------------------------------------
    let hitDepth = 0;
    let hnx = 0;
    let hny = 0;
    for (let i = 0; i < 2; i++) {
      const t = bodyCircle(car, i, this._tmp);
      const bx = t.x;
      const by = t.y;
      resolveCircle(this.city, t, BODY_RADIUS, this._hit);
      car.x += t.x - bx;
      car.y += t.y - by;
      if (this._hit.depth > 0) {
        hnx += this._hit.nx;
        hny += this._hit.ny;
        if (this._hit.depth > hitDepth) hitDepth = this._hit.depth;
        // Glancing blows slew the car around rather than stopping it dead.
        const armx = i === 0 ? cos : -cos;
        const army = i === 0 ? sin : -sin;
        car.ang += (armx * this._hit.ny - army * this._hit.nx) * 0.02;
      }
    }
    if (hitDepth > 0.05) {
      const lost = applyImpact(car, hnx, hny);
      // Hitting a building mostly punishes you by stopping you dead in the
      // middle of the horde - the dent itself is the smaller part of it.
      if (lost > 120) {
        this.health -= clamp((lost - 120) * 0.035, 0, 18);
        this.hurtTimer = 0;
        this.shake = Math.min(this.shake + lost * 0.02, 14);
        this.events.push({ type: 'crash', force: lost, x: car.x, y: car.y });
        for (let s = 0; s < 8; s++) {
          this.emitParticle(
            car.x + cos * 26, car.y + sin * 26,
            rr(this.rng, -140, 140), rr(this.rng, -140, 140),
            rr(this.rng, 0.2, 0.5), rr(this.rng, 1, 2.5), 2, this.rng(),
          );
        }
      }
    }

    // ---- flamethrower ----------------------------------------------------
    if (this.has(FLAME)) {
      this.flameCooldown -= dt;
      if (this.flameCooldown <= 0) {
        this.flameCooldown = rr(this.rng, FLAME_GAP[0], FLAME_GAP[1]);
        this.flameSpray = FLAME_SPRAY;
        this.events.push({ type: 'flame' });
      }
    }
    if (this.flameSpray > 0) {
      this.flameSpray -= dt;
      this.burn(dt);
    }

    // ---- gore -----------------------------------------------------------
    this.gore.update(dt);
    this.goreDrag = this.gore.plough(car, crushWidth);
    this.tyres(dt);
    // The fluid runs at half rate; it is smooth enough and costs half as much.
    this.fluidTick ^= 1;
    if (this.fluidTick === 0) this.blood.step(dt * 2);

    // ---- damage and healing ---------------------------------------------
    if (grabDamage > 0) {
      // Soft cap: a dozen of them is lethal, but not instantly. You get a few
      // seconds to drop into low gear and grind your way out.
      const dps = grabDamage / (1 + grabDamage / GRAB_SOFT_CAP);
      this.health -= dps * dt;
      this.hurtTimer = 0;
      this.shake = Math.min(this.shake + dps * dt * 0.6, 8);
      if (this.health > 0) this.events.push({ type: 'hurt', amount: dps });
    } else {
      this.hurtTimer += dt;
      if (this.hurtTimer > REGEN_DELAY) {
        this.health = Math.min(MAX_HEALTH, this.health + REGEN_RATE * dt);
      }
    }

    // ---- bookkeeping ------------------------------------------------------
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
    this.distance += Math.hypot(car.x - px, car.y - py);
    this.shake *= Math.exp(-5 * dt);

    this.updateParticles(dt);

    if (this.health <= 0) {
      this.health = 0;
      this.state = 'dead';
      this.deathCause = grabbers > 0 ? 'DRAGGED FROM THE WRECK' : 'WRAPPED AROUND A WALL';
      this.shake = 16;
      this.events.push({ type: 'death' });
    }
  }

  updateParticles(dt) {
    const arr = this.particles;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.live) continue;
      p.life -= dt;
      if (p.life <= 0) { p.live = false; continue; }
      const fr = Math.exp(-4.5 * dt);
      p.vx *= fr;
      p.vy *= fr;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  get totalScore() {
    const metres = this.distance / PX_PER_METRE;
    return Math.round(this.score + metres * 0.75 + this.time * 2);
  }
}

// ==================================================================
// js/sprites.js
// ==================================================================

// Every sprite is drawn once into an offscreen canvas at boot, then blitted
// thousands of times per frame. Sprites face +x, matching an angle of 0.



const SS = 2; // supersample factor, for crisp edges on hi-dpi screens

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * SS);
  c.height = Math.ceil(h * SS);
  const ctx = c.getContext('2d');
  ctx.scale(SS, SS);
  c.w = w;
  c.h = h;
  return { canvas: c, ctx };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCar(ctx, w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const L = CAR_LENGTH;
  const W = CAR_WIDTH;
  const x = cx - L / 2;
  const y = cy - W / 2;

  // Wheels poking out from under the body.
  ctx.fillStyle = '#14151a';
  for (const [wx, wy] of [[0.30, -0.5], [0.30, 0.5], [-0.30, -0.5], [-0.30, 0.5]]) {
    roundRect(ctx, cx + wx * L - 7, cy + wy * W - 4.5, 14, 9, 3);
    ctx.fill();
  }

  // Body.
  const body = ctx.createLinearGradient(0, y, 0, y + W);
  body.addColorStop(0, '#d94b3f');
  body.addColorStop(0.5, '#b62f27');
  body.addColorStop(1, '#8d1f1c');
  ctx.fillStyle = body;
  roundRect(ctx, x, y, L, W, 7);
  ctx.fill();
  ctx.strokeStyle = '#2b1112';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // Racing stripes down the length of the car.
  ctx.fillStyle = 'rgba(240,236,225,0.85)';
  ctx.fillRect(x + 5, cy - 6.5, L - 16, 4);
  ctx.fillRect(x + 5, cy + 2.5, L - 16, 4);

  // Cabin glass.
  ctx.fillStyle = '#1b2430';
  roundRect(ctx, cx - 11, y + 4, 22, W - 8, 5);
  ctx.fill();
  ctx.fillStyle = 'rgba(150,200,240,0.20)';
  roundRect(ctx, cx - 9, y + 5.5, 8, W - 11, 3);
  ctx.fill();

  // Front bumper / push bar - this is the business end.
  ctx.fillStyle = '#3a3d45';
  roundRect(ctx, x + L - 9, y + 1, 8, W - 2, 3);
  ctx.fill();
  ctx.fillStyle = '#5a5f6b';
  ctx.fillRect(x + L - 4, y + 3, 3, W - 6);

  // Lights.
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(x + L - 3.5, y + 3.5, 2.5, 5);
  ctx.fillRect(x + L - 3.5, y + W - 8.5, 2.5, 5);
  ctx.fillStyle = '#ff5a4a';
  ctx.fillRect(x + 1, y + 4, 2, 4.5);
  ctx.fillRect(x + 1, y + W - 8.5, 2, 4.5);

  // Rear spoiler.
  ctx.fillStyle = '#2b1112';
  roundRect(ctx, x - 1, y + 2, 4, W - 4, 2);
  ctx.fill();
}

function drawZombie(ctx, w, h, frame, rng) {
  const cx = w / 2;
  const cy = h / 2;
  const swing = Math.sin((frame / 4) * TAU);

  // Contact shadow, so a body still reads when it is standing in gore.
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath();
  ctx.ellipse(cx - 1, cy + 1, 8, 6.5, 0, 0, TAU);
  ctx.fill();

  const skin = ['#7d9a5e', '#6d8a52', '#88a06a', '#5f7f4c'][Math.floor(rng() * 4)];
  const cloth = ['#3c4a44', '#4a3f38', '#33404d', '#4c4438'][Math.floor(rng() * 4)];

  // Legs, trailing behind and shuffling out of phase.
  ctx.strokeStyle = cloth;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx - 2, cy + s * 3);
    ctx.lineTo(cx - 8, cy + s * 4.5 + swing * s * 2.5);
    ctx.stroke();
  }

  // Torso.
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.ellipse(cx - 1, cy, 7, 6, 0, 0, TAU);
  ctx.fill();

  // Arms reaching forward - the classic silhouette.
  ctx.strokeStyle = skin;
  ctx.lineWidth = 3.4;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx - 1, cy + s * 5);
    ctx.quadraticCurveTo(cx + 5, cy + s * 6, cx + 9.5, cy + s * (3 + swing * s * 1.5));
    ctx.stroke();
  }

  // Head.
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(cx + 3.5, cy, 5.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(20,30,15,0.55)';
  ctx.beginPath();
  ctx.arc(cx + 6, cy - 1.8, 1.2, 0, TAU);
  ctx.arc(cx + 6, cy + 1.8, 1.2, 0, TAU);
  ctx.fill();

  // A little gore already on the clothes.
  ctx.fillStyle = 'rgba(120,20,22,0.5)';
  ctx.beginPath();
  ctx.arc(cx - 2 + rng() * 4, cy - 2 + rng() * 4, 1.8, 0, TAU);
  ctx.fill();
}

function drawSkeleton(ctx, w, h, frame, rng) {
  const cx = w / 2;
  const cy = h / 2;
  const swing = Math.sin((frame / 4) * TAU);
  // Contact shadow, so a body still reads when it is standing in gore.
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(cx - 1, cy + 1, 7, 5.5, 0, 0, TAU);
  ctx.fill();

  const bone = ['#e2dcc4', '#d5cdb2', '#eae4cf'][Math.floor(rng() * 3)];

  ctx.strokeStyle = bone;
  ctx.lineCap = 'round';

  // Legs.
  ctx.lineWidth = 2.6;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx - 2, cy + s * 2.5);
    ctx.lineTo(cx - 7.5, cy + s * 4 + swing * s * 3);
    ctx.stroke();
  }

  // Ribcage.
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - 3 + i * 2.2, cy - 4.5);
    ctx.lineTo(cx - 3 + i * 2.2, cy + 4.5);
    ctx.stroke();
  }
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy);
  ctx.lineTo(cx + 2, cy);
  ctx.stroke();

  // Clawing arms.
  ctx.lineWidth = 2.2;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx - 1, cy + s * 4);
    ctx.quadraticCurveTo(cx + 4, cy + s * 5.5, cx + 9, cy + s * (2.5 + swing * s * 2));
    ctx.stroke();
  }

  // Skull.
  ctx.fillStyle = bone;
  ctx.beginPath();
  ctx.arc(cx + 3.5, cy, 4.6, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#22242a';
  ctx.beginPath();
  ctx.arc(cx + 5.4, cy - 1.7, 1.35, 0, TAU);
  ctx.arc(cx + 5.4, cy + 1.7, 1.35, 0, TAU);
  ctx.fill();
}

function drawMeat(ctx, w, h, rng) {
  const cx = w / 2;
  const cy = h / 2;
  const r = w * 0.38;
  const pts = 9;
  const dark = `hsl(${350 + rng() * 12}, ${52 + rng() * 18}%, ${13 + rng() * 8}%)`;
  const mid = `hsl(${352 + rng() * 10}, ${60 + rng() * 15}%, ${24 + rng() * 9}%)`;

  ctx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * TAU;
    const rad = r * (0.62 + rng() * 0.55);
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = mid;
  ctx.fill();
  ctx.strokeStyle = dark;
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // Wet highlight so piles read as glistening rather than flat.
  ctx.fillStyle = 'rgba(255,160,150,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.2, cy - r * 0.25, r * 0.3, r * 0.2, rng() * TAU, 0, TAU);
  ctx.fill();
}

function drawBone(ctx, w, h, rng) {
  const cx = w / 2;
  const cy = h / 2;
  ctx.fillStyle = `hsl(${44 + rng() * 10}, 22%, ${74 + rng() * 12}%)`;
  ctx.strokeStyle = 'rgba(60,50,40,0.5)';
  ctx.lineWidth = 1;
  const len = w * 0.42;
  const th = h * 0.16;
  roundRect(ctx, cx - len, cy - th, len * 2, th * 2, th);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx - len, cy, th * 1.5, 0, TAU);
  ctx.arc(cx + len, cy, th * 1.5, 0, TAU);
  ctx.fill();
}

function drawChar(ctx, w, h, rng) {
  const cx = w / 2;
  const cy = h / 2;
  const r = w * 0.36;
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) {
    const a = (i / 8) * TAU;
    const rad = r * (0.55 + rng() * 0.6);
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = `hsl(${20 + rng() * 14}, ${8 + rng() * 10}%, ${8 + rng() * 7}%)`;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // Embers still glowing in the ash.
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = `hsla(${18 + rng() * 22}, 90%, ${45 + rng() * 20}%, ${0.35 + rng() * 0.4})`;
    ctx.beginPath();
    ctx.arc(cx + (rng() - 0.5) * r, cy + (rng() - 0.5) * r, 0.8 + rng() * 1.4, 0, TAU);
    ctx.fill();
  }
}

/** The crate an upgrade sits in, with its own icon on the lid. */
function drawPickup(ctx, w, h, kind) {
  const cx = w / 2;
  const cy = h / 2;
  const colour = PICKUP_KINDS[kind].colour;
  const box = 26;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, cx - box / 2 + 3, cy - box / 2 + 5, box, box, 4);
  ctx.fill();

  ctx.fillStyle = '#23252c';
  roundRect(ctx, cx - box / 2, cy - box / 2, box, box, 4);
  ctx.fill();
  ctx.strokeStyle = colour;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';

  if (kind === WIRE) {
    // A coil of wire seen end-on, with barbs.
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, TAU);
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 4.5, Math.sin(a) * 4.5);
      ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
      ctx.stroke();
    }
  } else if (kind === WHEELS) {
    // A fat tyre with tread blocks.
    ctx.beginPath();
    ctx.arc(0, 0, 8.5, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 3.4, 0, TAU);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.lineTo(Math.cos(a) * 8.5, Math.sin(a) * 8.5);
      ctx.stroke();
    }
  } else {
    // A flame.
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(7, -2, 4.5, 4);
    ctx.quadraticCurveTo(3, 9, 0, 10);
    ctx.quadraticCurveTo(-3, 9, -4.5, 4);
    ctx.quadraticCurveTo(-7, -2, 0, -10);
    ctx.fill();
    ctx.fillStyle = '#2a1206';
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.quadraticCurveTo(3, 2, 1.5, 6);
    ctx.quadraticCurveTo(0, 8, -1.5, 6);
    ctx.quadraticCurveTo(-3, 2, 0, -2);
    ctx.fill();
  }
  ctx.restore();
}

/** Oversized tyres, drawn underneath the car while the upgrade is running. */
function drawBigWheels(ctx, w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const off = CAR_WIDTH * 0.5 * 1.75;
  ctx.fillStyle = '#101116';
  ctx.strokeStyle = '#2e3038';
  ctx.lineWidth = 1.5;
  for (const sx of [0.30, -0.30]) {
    for (const sy of [1, -1]) {
      const x = cx + sx * CAR_LENGTH - 11;
      const y = cy + sy * off - 8;
      roundRect(ctx, x, y, 22, 16, 5);
      ctx.fill();
      ctx.stroke();
      // Tread.
      ctx.strokeStyle = 'rgba(150,155,170,0.30)';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 3 + i * 5, y + 2);
        ctx.lineTo(x + 3 + i * 5, y + 14);
        ctx.stroke();
      }
      ctx.strokeStyle = '#2e3038';
    }
  }
}

/** Barbed wire wrapped round the bodywork, drawn over the car. */
function drawWire(ctx, w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const L = CAR_LENGTH;
  const W = CAR_WIDTH;
  ctx.strokeStyle = '#cfe0e8';
  ctx.lineWidth = 1.6;
  roundRect(ctx, cx - L / 2 - 1, cy - W / 2 - 1, L + 2, W + 2, 8);
  ctx.stroke();

  // Barbs round the perimeter.
  ctx.lineWidth = 1.3;
  const barbs = 22;
  for (let i = 0; i < barbs; i++) {
    const t = i / barbs;
    let x;
    let y;
    let nx;
    let ny;
    if (t < 0.5) {
      x = cx - L / 2 + L * (t * 2);
      y = cy - W / 2 - 1;
      nx = 0;
      ny = -1;
    } else {
      x = cx + L / 2 - L * ((t - 0.5) * 2);
      y = cy + W / 2 + 1;
      nx = 0;
      ny = 1;
    }
    ctx.beginPath();
    ctx.moveTo(x - 2.5, y - ny * 1.5);
    ctx.lineTo(x + 2.5, y + ny * 3.5);
    ctx.moveTo(x + 2.5, y - ny * 1.5);
    ctx.lineTo(x - 2.5, y + ny * 3.5);
    ctx.stroke();
  }
  // And across the nose, where most of the shredding happens.
  for (let i = 0; i < 4; i++) {
    const y = cy - W / 2 + 4 + i * ((W - 8) / 3);
    ctx.beginPath();
    ctx.moveTo(cx + L / 2 - 2, y - 2.5);
    ctx.lineTo(cx + L / 2 + 4, y + 2.5);
    ctx.moveTo(cx + L / 2 + 4, y - 2.5);
    ctx.lineTo(cx + L / 2 - 2, y + 2.5);
    ctx.stroke();
  }
}

function makeSprites() {
  const rng = mulberry32(1337);

  const carPad = 10;
  const car = makeCanvas(CAR_LENGTH + carPad * 2, CAR_WIDTH + carPad * 2);
  drawCar(car.ctx, car.canvas.w, car.canvas.h);

  const ENEMY = 30;
  const zombies = [];
  const skeletons = [];
  for (let f = 0; f < 4; f++) {
    const z = makeCanvas(ENEMY, ENEMY);
    drawZombie(z.ctx, ENEMY, ENEMY, f, mulberry32(90 + f));
    zombies.push(z.canvas);

    const s = makeCanvas(ENEMY, ENEMY);
    drawSkeleton(s.ctx, ENEMY, ENEMY, f, mulberry32(300 + f));
    skeletons.push(s.canvas);
  }

  // A handful of variants each, picked per chunk so piles are not repetitive.
  const meat = [];
  const bone = [];
  for (let i = 0; i < 6; i++) {
    const m = makeCanvas(32, 32);
    drawMeat(m.ctx, 32, 32, mulberry32(500 + i));
    meat.push(m.canvas);

    const b = makeCanvas(24, 24);
    drawBone(b.ctx, 24, 24, mulberry32(700 + i));
    bone.push(b.canvas);
  }

  const char = [];
  for (let i = 0; i < 6; i++) {
    const c = makeCanvas(26, 26);
    drawChar(c.ctx, 26, 26, mulberry32(900 + i));
    char.push(c.canvas);
  }

  const pickups = [];
  for (let k = 0; k < PICKUP_KINDS.length; k++) {
    const c = makeCanvas(44, 44);
    drawPickup(c.ctx, 44, 44, k);
    pickups.push(c.canvas);
  }

  const wheelPad = 14;
  const bigWheels = makeCanvas(CAR_LENGTH + carPad * 2, CAR_WIDTH * 1.75 + wheelPad * 2);
  drawBigWheels(bigWheels.ctx, bigWheels.canvas.w, bigWheels.canvas.h);

  const wire = makeCanvas(CAR_LENGTH + carPad * 2, CAR_WIDTH + carPad * 2);
  drawWire(wire.ctx, wire.canvas.w, wire.canvas.h);

  return {
    car: car.canvas,
    zombies, skeletons, meat, bone, char,
    pickups,
    bigWheels: bigWheels.canvas,
    wire: wire.canvas,
    enemySize: ENEMY,
    rng,
  };
}

// Keyboard handling. Held keys drive the car; edge-triggered presses are
// queued so a tap is never missed between frames.

const THROTTLE = ['KeyW', 'ArrowUp'];
const BRAKE = ['KeyS', 'ArrowDown'];
const LEFT = ['KeyA', 'ArrowLeft'];
const RIGHT = ['KeyD', 'ArrowRight'];
const SWALLOW = new Set([
  ...THROTTLE, ...BRAKE, ...LEFT, ...RIGHT,
  'Space', 'ShiftLeft', 'ShiftRight', 'KeyP', 'KeyM', 'Enter', 'KeyR',
]);

class Input {
  constructor(target = window) {
    this.down = new Set();
    this.presses = new Set();

    target.addEventListener('keydown', (e) => {
      if (SWALLOW.has(e.code)) e.preventDefault();
      if (e.repeat) return;           // no auto-repeat on edge events
      this.down.add(e.code);
      this.presses.add(e.code);
    });
    target.addEventListener('keyup', (e) => {
      if (SWALLOW.has(e.code)) e.preventDefault();
      this.down.delete(e.code);
    });
    target.addEventListener('blur', () => this.down.clear());
  }

  held(codes) {
    for (const c of codes) if (this.down.has(c)) return true;
    return false;
  }

  /** True once per physical key press. */
  pressed(...codes) {
    for (const c of codes) {
      if (this.presses.has(c)) {
        this.presses.delete(c);
        return true;
      }
    }
    return false;
  }

  anyPressed() {
    return this.presses.size > 0;
  }

  endFrame() {
    this.presses.clear();
  }

  read() {
    let throttle = 0;
    let steer = 0;
    const gas = this.held(THROTTLE);
    const brake = this.held(BRAKE);
    if (gas) throttle += 1;
    if (brake) throttle -= 1;
    if (this.held(LEFT)) steer -= 1;
    if (this.held(RIGHT)) steer += 1;
    // Both at once holds the car on the brakes and lights up the tyres.
    return { throttle, steer, burnout: gas && brake };
  }
}

// Procedural audio - no asset files. An engine drone whose pitch tracks the
// revs, plus short synthesised hits for splats, bone and sheet metal.

const MAX_HITS_PER_FRAME = 3;

class GameAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.started = false;
    this.hitsThisFrame = 0;
    this.lastSplat = 0;
  }

  /** Must be called from a user gesture - browsers block audio otherwise. */
  resume() {
    if (this.ctx === null) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this._build();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  _build() {
    const ctx = this.ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(ctx.destination);

    // Shared noise buffer for all the percussive hits.
    const len = Math.floor(ctx.sampleRate * 0.5);
    this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    // Engine: two detuned saws through a low-pass that opens with the revs.
    this.engineGain = ctx.createGain();
    this.engineGain.gain.value = 0;
    this.engineFilter = ctx.createBiquadFilter();
    this.engineFilter.type = 'lowpass';
    this.engineFilter.frequency.value = 400;
    this.engineFilter.Q.value = 3;
    this.engineGain.connect(this.engineFilter);
    this.engineFilter.connect(this.master);

    this.osc = [];
    for (const [type, detune, gain] of [['sawtooth', 0, 0.5], ['sawtooth', 7, 0.35], ['square', -1200, 0.2]]) {
      const o = ctx.createOscillator();
      o.type = type;
      o.detune.value = detune;
      const g = ctx.createGain();
      g.gain.value = gain;
      o.connect(g);
      g.connect(this.engineGain);
      o.start();
      this.osc.push(o);
    }
    this.started = true;
  }

  _noiseBurst(dur, freq, type, gain, decay = 1) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = 0.6 + Math.random() * 0.8;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * decay);
    src.connect(f);
    f.connect(g);
    g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.05);
  }

  beginFrame() {
    this.hitsThisFrame = 0;
  }

  engine(rpm, gearLow, load) {
    if (!this.started || this.muted) return;
    const base = gearLow ? 62 : 44;
    const f = base + rpm * (gearLow ? 150 : 190);
    const t = this.ctx.currentTime;
    for (const o of this.osc) o.frequency.setTargetAtTime(f, t, 0.05);
    this.engineFilter.frequency.setTargetAtTime(320 + rpm * 1500 + load * 300, t, 0.08);
    this.engineGain.gain.setTargetAtTime(0.035 + rpm * 0.05, t, 0.1);
  }

  idle() {
    if (!this.started) return;
    this.engineGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
  }

  splat(power) {
    if (!this.started || this.muted) return;
    if (this.hitsThisFrame >= MAX_HITS_PER_FRAME) return;
    const now = this.ctx.currentTime;
    if (now - this.lastSplat < 0.035) return;
    this.lastSplat = now;
    this.hitsThisFrame++;
    this._noiseBurst(0.16, 300 + clamp(power, 0, 600) * 0.5, 'lowpass', 0.30);
  }

  bone() {
    if (!this.started || this.muted) return;
    if (this.hitsThisFrame >= MAX_HITS_PER_FRAME) return;
    this.hitsThisFrame++;
    this._noiseBurst(0.09, 2600, 'highpass', 0.16, 0.7);
  }

  crash(force) {
    if (!this.started || this.muted) return;
    this._noiseBurst(0.45, 220, 'lowpass', clamp(force / 500, 0.15, 0.6));
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'triangle';
    const g = ctx.createGain();
    const t = ctx.currentTime;
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + 0.4);
  }

  shift() {
    if (!this.started || this.muted) return;
    this._noiseBurst(0.07, 1400, 'bandpass', 0.14, 0.6);
  }

  death() {
    if (!this.started || this.muted) return;
    this.crash(600);
    this._noiseBurst(1.2, 160, 'lowpass', 0.4);
  }

  /** Bright two-note chime when you drive over a crate. */
  pickup() {
    if (!this.started || this.muted) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    for (const [freq, delay] of [[660, 0], [990, 0.09]]) {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, t + delay);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + delay);
      g.gain.exponentialRampToValueAtTime(0.22, t + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.26);
      o.connect(g);
      g.connect(this.master);
      o.start(t + delay);
      o.stop(t + delay + 0.3);
    }
  }

  /** The whoosh of the flamethrower letting go. */
  flame() {
    if (!this.started || this.muted) return;
    this._noiseBurst(0.55, 900, 'bandpass', 0.26, 1);
    this._noiseBurst(0.5, 240, 'lowpass', 0.18, 1);
  }

  /** Meat tearing on the wire - drier and thinner than a full splat. */
  shred() {
    if (!this.started || this.muted) return;
    if (this.hitsThisFrame >= MAX_HITS_PER_FRAME) return;
    this.hitsThisFrame++;
    this._noiseBurst(0.1, 1800, 'bandpass', 0.13, 0.8);
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.started) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, this.ctx.currentTime, 0.05);
    }
    return this.muted;
  }
}
