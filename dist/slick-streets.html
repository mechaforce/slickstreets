<title>Slick Streets</title>
<style>
:root {
  color-scheme: dark;
  --ink: #f2efe6;
  --ground: #0a0b0e;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* The game is driven entirely with the keyboard - stop mobile gestures. */
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
  image-rendering: auto;
  /* The canvas handles every gesture itself: no scrolling, no pinch zoom,
     no long-press callout, no blue flash under a thumb. */
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.notice {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 18px;
}

/* Standalone build: the page is nothing but the game. */
#hint {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  padding: 7px 14px;
  font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: 0.08em;
  color: rgba(242, 239, 230, 0.72);
  background: rgba(8, 9, 12, 0.82);
  border: 1px solid rgba(242, 239, 230, 0.16);
  pointer-events: none;
  transition: opacity 0.4s ease;
}
#hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  #hint { transition: none; }
}

<canvas id="game" tabindex="0"></canvas>
<div id="hint">CLICK THE STREET, THEN PRESS ENTER</div>

<script>
(function () {
  'use strict';

// ==================================================================
// js/util.js
// ==================================================================

// Small math / RNG helpers shared by the simulation and the renderer.

const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);

/** Deterministic 32-bit PRNG so a seed always builds the same city. */
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rr = (rng, a, b) => a + (b - a) * rng();
const ri = (rng, a, b) => Math.floor(a + (b - a + 1) * rng());
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

function dist2(ax, ay, bx, by) {
  const dx = ax - bx;
  const dy = ay - by;
  return dx * dx + dy * dy;
}

function angleDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

/** Move `v` toward `target` by at most `delta`. */
function approach(v, target, delta) {
  return v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
}

/** Frame-rate independent smoothing factor for exponential decay. */
function damp(rate, dt) {
  return 1 - Math.exp(-rate * dt);
}

// ==================================================================
// js/fluid.js
// ==================================================================

// A light 2D fluid for the blood: semi-Lagrangian advection with a few
// Gauss-Seidel pressure iterations, in the style of Stam's stable fluids.
//
// It only covers a window of the city around the car. Blood that leaves the
// window is gone from the simulation, which is fine - by then it has already
// been baked into the permanent stains the renderer keeps. So this layer is
// the *wet* blood: it pools, it gets dragged and thrown by the tyres, and it
// is what makes the road slippery.
//
// No DOM in here; the renderer reads the grid out and draws it.

const CELL_SIZE = 18;
const GRID = 128;            // 128 * 18 = 2304px of city
const SLACK = 8;                    // cells of drift before the window moves
const PRESSURE_ITERS = 4;

/** Velocities are stored in cells per second, densities in "how bloody". */
class BloodField {
  constructor(cells = GRID, cellSize = CELL_SIZE) {
    this.n = cells;
    this.cs = cellSize;
    this.size = cells * cells;
    this.d = new Float32Array(this.size);
    this.u = new Float32Array(this.size);
    this.v = new Float32Array(this.size);
    this.d0 = new Float32Array(this.size);
    this.u0 = new Float32Array(this.size);
    this.v0 = new Float32Array(this.size);
    this.p = new Float32Array(this.size);
    this.div = new Float32Array(this.size);
    this.tmp = new Float32Array(this.size);
    this.ox = 0;
    this.oy = 0;
    this.wet = 0; // total density, so callers can skip work on a clean road
    // Only the part of the grid that actually has blood in it is simulated;
    // on a clean road that is nothing at all.
    this.bi0 = 0; this.bi1 = -1; this.bj0 = 0; this.bj1 = -1;
  }

  get empty() { return this.bi1 < this.bi0; }

  /** Grow the simulated region to include a cell range. */
  _touch(i0, i1, j0, j1) {
    const n = this.n;
    if (i1 < 0 || j1 < 0 || i0 > n - 1 || j0 > n - 1) return;
    if (this.empty) {
      this.bi0 = Math.max(0, i0); this.bi1 = Math.min(n - 1, i1);
      this.bj0 = Math.max(0, j0); this.bj1 = Math.min(n - 1, j1);
      return;
    }
    if (i0 < this.bi0) this.bi0 = Math.max(0, i0);
    if (i1 > this.bi1) this.bi1 = Math.min(n - 1, i1);
    if (j0 < this.bj0) this.bj0 = Math.max(0, j0);
    if (j1 > this.bj1) this.bj1 = Math.min(n - 1, j1);
  }

  reset() {
    this.d.fill(0);
    this.u.fill(0);
    this.v.fill(0);
    this.wet = 0;
    this.bi0 = 0; this.bi1 = -1; this.bj0 = 0; this.bj1 = -1;
  }

  get width() { return this.n * this.cs; }

  // ---- window ------------------------------------------------------------

  /** Keep the simulated window centred on a point, moving it in whole cells. */
  anchor(x, y) {
    const half = this.n * 0.5 * this.cs;
    const di = Math.round((x - half - this.ox) / this.cs);
    const dj = Math.round((y - half - this.oy) / this.cs);
    if (Math.abs(di) < SLACK && Math.abs(dj) < SLACK) return;
    if (Math.abs(di) >= this.n || Math.abs(dj) >= this.n) {
      // Teleported somewhere else entirely: nothing to carry over.
      this.reset();
    } else {
      this._shift(this.d, di, dj);
      this._shift(this.u, di, dj);
      this._shift(this.v, di, dj);
      if (!this.empty) {
        const n = this.n;
        this.bi0 = Math.max(0, this.bi0 - di);
        this.bi1 = Math.min(n - 1, this.bi1 - di);
        this.bj0 = Math.max(0, this.bj0 - dj);
        this.bj1 = Math.min(n - 1, this.bj1 - dj);
        if (this.bi1 < this.bi0 || this.bj1 < this.bj0) {
          this.bi1 = -1; this.bj1 = -1;
        }
      }
    }
    this.ox += di * this.cs;
    this.oy += dj * this.cs;
  }

  _shift(f, di, dj) {
    const n = this.n;
    const tmp = this.tmp;
    tmp.set(f);
    f.fill(0);
    for (let j = 0; j < n; j++) {
      const sj = j + dj;
      if (sj < 0 || sj >= n) continue;
      const row = j * n;
      const srow = sj * n;
      for (let i = 0; i < n; i++) {
        const si = i + di;
        if (si < 0 || si >= n) continue;
        f[i + row] = tmp[si + srow];
      }
    }
  }

  // ---- reading and writing ------------------------------------------------

  /** Grid coordinate of a world point (may be outside the window). */
  gx(x) { return (x - this.ox) / this.cs; }
  gy(y) { return (y - this.oy) / this.cs; }

  /** Bilinear density at a world point. 0 on dry road. */
  sample(x, y) {
    const n = this.n;
    const fx = this.gx(x);
    const fy = this.gy(y);
    if (fx < 0 || fy < 0 || fx >= n - 1 || fy >= n - 1) return 0;
    const i = fx | 0;
    const j = fy | 0;
    const sx = fx - i;
    const sy = fy - j;
    const k = i + j * n;
    const d = this.d;
    return (d[k] * (1 - sx) + d[k + 1] * sx) * (1 - sy)
         + (d[k + n] * (1 - sx) + d[k + n + 1] * sx) * sy;
  }

  /** Pour blood in, optionally throwing it in a direction. */
  add(x, y, amount, wvx = 0, wvy = 0, radius = 20) {
    const n = this.n;
    const cs = this.cs;
    const fx = this.gx(x);
    const fy = this.gy(y);
    const r = Math.max(0.8, radius / cs);
    const i0 = Math.max(0, Math.floor(fx - r));
    const i1 = Math.min(n - 1, Math.ceil(fx + r));
    const j0 = Math.max(0, Math.floor(fy - r));
    const j1 = Math.min(n - 1, Math.ceil(fy + r));
    if (i1 < i0 || j1 < j0) return;
    this._touch(i0, i1, j0, j1);

    const vx = wvx / cs;
    const vy = wvy / cs;
    const r2 = r * r;
    for (let j = j0; j <= j1; j++) {
      const dy = j - fy;
      for (let i = i0; i <= i1; i++) {
        const dx = i - fx;
        const q = (dx * dx + dy * dy) / r2;
        if (q > 1) continue;
        const w = 1 - q;
        const k = i + j * n;
        this.d[k] += amount * w;
        this.u[k] += vx * w;
        this.v[k] += vy * w;
      }
    }
  }

  /** Drag whatever is here, without adding any more of it. */
  addVelocity(x, y, wvx, wvy, radius = 20) {
    const n = this.n;
    const cs = this.cs;
    const fx = this.gx(x);
    const fy = this.gy(y);
    const r = Math.max(0.8, radius / cs);
    const i0 = Math.max(0, Math.floor(fx - r));
    const i1 = Math.min(n - 1, Math.ceil(fx + r));
    const j0 = Math.max(0, Math.floor(fy - r));
    const j1 = Math.min(n - 1, Math.ceil(fy + r));
    if (i1 < i0 || j1 < j0) return;
    this._touch(i0, i1, j0, j1);

    const vx = wvx / cs;
    const vy = wvy / cs;
    const r2 = r * r;
    for (let j = j0; j <= j1; j++) {
      const dy = j - fy;
      for (let i = i0; i <= i1; i++) {
        const dx = i - fx;
        const q = (dx * dx + dy * dy) / r2;
        if (q > 1) continue;
        const w = 1 - q;
        const k = i + j * n;
        this.u[k] += vx * w;
        this.v[k] += vy * w;
      }
    }
  }

  /** Scoop blood up off the road - what the tyres pick up and carry away. */
  take(x, y, fraction, radius = 16) {
    const n = this.n;
    const fx = this.gx(x);
    const fy = this.gy(y);
    const r = Math.max(0.8, radius / this.cs);
    const i0 = Math.max(0, Math.floor(fx - r));
    const i1 = Math.min(n - 1, Math.ceil(fx + r));
    const j0 = Math.max(0, Math.floor(fy - r));
    const j1 = Math.min(n - 1, Math.ceil(fy + r));
    let taken = 0;
    const r2 = r * r;
    for (let j = j0; j <= j1; j++) {
      const dy = j - fy;
      for (let i = i0; i <= i1; i++) {
        const dx = i - fx;
        const q = (dx * dx + dy * dy) / r2;
        if (q > 1) continue;
        const k = i + j * n;
        const got = this.d[k] * fraction * (1 - q);
        this.d[k] -= got;
        taken += got;
      }
    }
    return taken;
  }

  // ---- the simulation ------------------------------------------------------

  _advect(dst, src, dt) {
    const n = this.n;
    const u = this.u;
    const v = this.v;
    const max = n - 1.001;
    for (let j = this.bj0; j <= this.bj1; j++) {
      const row = j * n;
      for (let i = this.bi0; i <= this.bi1; i++) {
        const k = i + row;
        let x = i - dt * u[k];
        let y = j - dt * v[k];
        if (x < 0) x = 0; else if (x > max) x = max;
        if (y < 0) y = 0; else if (y > max) y = max;
        const i0 = x | 0;
        const j0 = y | 0;
        const sx = x - i0;
        const sy = y - j0;
        const a = i0 + j0 * n;
        dst[k] = (src[a] * (1 - sx) + src[a + 1] * sx) * (1 - sy)
               + (src[a + n] * (1 - sx) + src[a + n + 1] * sx) * sy;
      }
    }
  }

  /** Push the velocity field toward divergence-free - this is what swirls. */
  _project() {
    const n = this.n;
    const u = this.u;
    const v = this.v;
    const p = this.p;
    const div = this.div;
    const i0 = Math.max(1, this.bi0);
    const i1 = Math.min(n - 2, this.bi1);
    const j0 = Math.max(1, this.bj0);
    const j1 = Math.min(n - 2, this.bj1);

    for (let j = j0; j <= j1; j++) {
      const row = j * n;
      for (let i = i0; i <= i1; i++) {
        const k = i + row;
        div[k] = -0.5 * (u[k + 1] - u[k - 1] + v[k + n] - v[k - n]);
        p[k] = 0;
      }
    }
    for (let it = 0; it < PRESSURE_ITERS; it++) {
      for (let j = j0; j <= j1; j++) {
        const row = j * n;
        for (let i = i0; i <= i1; i++) {
          const k = i + row;
          p[k] = (div[k] + p[k - 1] + p[k + 1] + p[k - n] + p[k + n]) * 0.25;
        }
      }
    }
    for (let j = j0; j <= j1; j++) {
      const row = j * n;
      for (let i = i0; i <= i1; i++) {
        const k = i + row;
        u[k] -= 0.5 * (p[k + 1] - p[k - 1]);
        v[k] -= 0.5 * (p[k + n] - p[k - n]);
      }
    }
  }

  /** A touch of spreading, so pools have soft edges rather than hard cells. */
  _diffuse(amount) {
    const n = this.n;
    const d = this.d;
    const t = this.tmp;
    t.set(d);
    const keep = 1 - amount;
    const i0 = Math.max(1, this.bi0);
    const i1 = Math.min(n - 2, this.bi1);
    const j0 = Math.max(1, this.bj0);
    const j1 = Math.min(n - 2, this.bj1);
    for (let j = j0; j <= j1; j++) {
      const row = j * n;
      for (let i = i0; i <= i1; i++) {
        const k = i + row;
        d[k] = t[k] * keep
          + (t[k - 1] + t[k + 1] + t[k - n] + t[k + n]) * (amount * 0.25);
      }
    }
  }

  step(dt) {
    if (dt <= 0 || this.empty) return;
    const damp = Math.exp(-3.4 * dt);   // blood is viscous; it stops quickly
    const dry = Math.exp(-0.085 * dt);  // and slowly soaks into the tarmac

    // Room for this step's spreading and advection to move into.
    this._touch(this.bi0 - 2, this.bi1 + 2, this.bj0 - 2, this.bj1 + 2);

    const n = this.n;
    const u = this.u;
    const v = this.v;
    for (let j = this.bj0; j <= this.bj1; j++) {
      const row = j * n;
      for (let i = this.bi0; i <= this.bi1; i++) {
        u[i + row] *= damp;
        v[i + row] *= damp;
      }
    }

    // Self-advection then projection: the swirl in the smear comes from here.
    this.u0.set(u);
    this.v0.set(v);
    this._advect(u, this.u0, dt);
    this._advect(v, this.v0, dt);
    this._project();

    this.d0.set(this.d);
    this._advect(this.d, this.d0, dt);
    this._diffuse(Math.min(0.5, 1.6 * dt));

    // Dry it off, and shrink the active region back around what is left.
    const d = this.d;
    let total = 0;
    let ni0 = n;
    let ni1 = -1;
    let nj0 = n;
    let nj1 = -1;
    for (let j = this.bj0; j <= this.bj1; j++) {
      const row = j * n;
      for (let i = this.bi0; i <= this.bi1; i++) {
        const k = i + row;
        const val = d[k] * dry;
        if (val < 0.0008) {
          d[k] = 0;
          u[k] = 0;
          v[k] = 0;
          continue;
        }
        d[k] = val;
        total += val;
        if (i < ni0) ni0 = i;
        if (i > ni1) ni1 = i;
        if (j < nj0) nj0 = j;
        if (j > nj1) nj1 = j;
      }
    }
    this.wet = total;
    this.bi0 = ni0; this.bi1 = ni1;
    this.bj0 = nj0; this.bj1 = nj1;
  }
}

// ==================================================================
// js/spatialhash.js
// ==================================================================

// Uniform grid used for the thousands of enemies and gore chunks.
// Buckets are recycled between frames so a full rebuild allocates nothing.

const BIAS = 4096;
const STRIDE = 8192;

class SpatialHash {
  constructor(cellSize) {
    this.cellSize = cellSize;
    this.inv = 1 / cellSize;
    this.buckets = new Map();
    this.used = [];
  }

  clear() {
    for (let i = 0; i < this.used.length; i++) this.used[i].length = 0;
    this.used.length = 0;
  }

  _key(cx, cy) {
    return (cx + BIAS) * STRIDE + (cy + BIAS);
  }

  insert(x, y, item) {
    const cx = Math.floor(x * this.inv);
    const cy = Math.floor(y * this.inv);
    const k = this._key(cx, cy);
    let b = this.buckets.get(k);
    if (b === undefined) {
      b = [];
      this.buckets.set(k, b);
    }
    if (b.length === 0) this.used.push(b);
    b.push(item);
  }

  /**
   * Collect every item stored in cells overlapping the circle (x, y, r).
   * Results are a superset of the circle - callers do the exact test.
   */
  query(x, y, r, out) {
    out.length = 0;
    const x0 = Math.floor((x - r) * this.inv);
    const x1 = Math.floor((x + r) * this.inv);
    const y0 = Math.floor((y - r) * this.inv);
    const y1 = Math.floor((y + r) * this.inv);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const b = this.buckets.get(this._key(cx, cy));
        if (b === undefined) continue;
        for (let i = 0; i < b.length; i++) out.push(b[i]);
      }
    }
    return out;
  }

  /** Visit items in cells overlapping an axis-aligned rect. */
  forEachInRect(x, y, w, h, fn) {
    const x0 = Math.floor(x * this.inv);
    const x1 = Math.floor((x + w) * this.inv);
    const y0 = Math.floor(y * this.inv);
    const y1 = Math.floor((y + h) * this.inv);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const b = this.buckets.get(this._key(cx, cy));
        if (b === undefined) continue;
        for (let i = 0; i < b.length; i++) fn(b[i]);
      }
    }
  }
}

// ==================================================================
// js/city.js
// ==================================================================

// Procedural city: a grid of blocks separated by roads. Every solid is an
// axis-aligned box indexed by block cell, which keeps collision queries O(1).

const CELL = 460;   // block pitch, road centre to road centre
const ROAD = 150;   // drivable width between block interiors

const WALL_COLORS = ['#4a4b56', '#565361', '#3f4450', '#5c5145', '#4d4a41', '#63606d'];
const ROOF_COLORS = ['#6e6f7d', '#7b7787', '#5f6675', '#857462', '#6f6b5f', '#8a8697'];

/** One solid obstacle. `top` is used by the renderer for fake extrusion. */
function solid(x, y, w, h, kind, wall, roof, top) {
  return { x, y, w, h, kind, wall, roof, top };
}

/**
 * Split a rect into 1..n sub-rects, recursing on the longer axis.
 * Produces believable rows of terraced buildings rather than a uniform grid.
 */
function subdivide(rng, x, y, w, h, depth, out) {
  const minSide = 78;
  if (depth <= 0 || (w < minSide * 2 && h < minSide * 2) || rng() < 0.18) {
    out.push([x, y, w, h]);
    return;
  }
  const splitX = w > h ? rng() < 0.85 : rng() < 0.15;
  if (splitX && w >= minSide * 2) {
    const t = rr(rng, 0.34, 0.66);
    const a = Math.round(w * t);
    subdivide(rng, x, y, a, h, depth - 1, out);
    subdivide(rng, x + a, y, w - a, h, depth - 1, out);
  } else if (!splitX && h >= minSide * 2) {
    const t = rr(rng, 0.34, 0.66);
    const a = Math.round(h * t);
    subdivide(rng, x, y, w, a, depth - 1, out);
    subdivide(rng, x, y + a, w, h - a, depth - 1, out);
  } else {
    out.push([x, y, w, h]);
  }
}

function generateCity(seed = 1, cols = 40, rows = 40) {
  const rng = mulberry32(seed >>> 0);
  const city = {
    seed,
    cols,
    rows,
    cell: CELL,
    road: ROAD,
    width: cols * CELL,
    height: rows * CELL,
    blocks: [],
    solids: [],
    grid: new Map(),
  };

  const put = (cx, cy, s) => {
    const k = cx * 8192 + cy;
    let list = city.grid.get(k);
    if (list === undefined) city.grid.set(k, (list = []));
    list.push(s);
    city.solids.push(s);
  };

  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const bx = cx * CELL + ROAD * 0.5;
      const by = cy * CELL + ROAD * 0.5;
      const bw = CELL - ROAD;
      const bh = CELL - ROAD;

      const roll = rng();
      const type = roll < 0.09 ? 'park' : roll < 0.18 ? 'lot' : 'buildings';
      const block = { cx, cy, x: bx, y: by, w: bw, h: bh, type, props: [] };
      city.blocks.push(block);

      if (type === 'buildings') {
        const pad = 16;
        const parts = [];
        subdivide(rng, bx + pad, by + pad, bw - pad * 2, bh - pad * 2, 2, parts);
        for (const [px, py, pw, ph] of parts) {
          const gap = rr(rng, 3, 11);
          const w = pw - gap * 2;
          const h = ph - gap * 2;
          if (w < 42 || h < 42) continue;
          const idx = ri(rng, 0, WALL_COLORS.length - 1);
          put(cx, cy, solid(px + gap, py + gap, w, h, 'building',
            WALL_COLORS[idx], ROOF_COLORS[idx], rr(rng, 34, 96)));
        }
      } else if (type === 'park') {
        const n = ri(rng, 4, 9);
        for (let i = 0; i < n; i++) {
          const r = rr(rng, 16, 26);
          const x = rr(rng, bx + 30, bx + bw - 30 - r * 2);
          const y = rr(rng, by + 30, by + bh - 30 - r * 2);
          put(cx, cy, solid(x, y, r * 2, r * 2, 'tree', '#2f4a2c', '#3f6b39', rr(rng, 40, 62)));
        }
      } else {
        const n = ri(rng, 2, 5);
        for (let i = 0; i < n; i++) {
          const horiz = rng() < 0.5;
          const w = horiz ? 56 : 28;
          const h = horiz ? 28 : 56;
          const x = rr(rng, bx + 24, bx + bw - 24 - w);
          const y = rr(rng, by + 24, by + bh - 24 - h);
          put(cx, cy, solid(x, y, w, h, 'wreck',
            pick(rng, ['#5b3a3a', '#3a4a5b', '#4a4a3a', '#52525c']), '#2a2a30', 16));
        }
      }
    }
  }

  // Boundary walls so the player cannot leave the map.
  const T = 220;
  const W = city.width;
  const H = city.height;
  const edge = (x, y, w, h) => {
    const s = solid(x, y, w, h, 'wall', '#33343d', '#43444f', 130);
    city.solids.push(s);
    city.edges = city.edges || [];
    city.edges.push(s);
  };
  edge(-T, -T, W + T * 2, T);
  edge(-T, H, W + T * 2, T);
  edge(-T, 0, T, H);
  edge(W, 0, T, H);

  return city;
}

/** Solids whose block cell overlaps the circle, plus the boundary walls. */
function solidsNear(city, x, y, r, out) {
  out.length = 0;
  const c = city.cell;
  const x0 = Math.floor((x - r) / c);
  const x1 = Math.floor((x + r) / c);
  const y0 = Math.floor((y - r) / c);
  const y1 = Math.floor((y + r) / c);
  for (let cy = y0; cy <= y1; cy++) {
    for (let cx = x0; cx <= x1; cx++) {
      const list = city.grid.get(cx * 8192 + cy);
      if (list === undefined) continue;
      for (let i = 0; i < list.length; i++) out.push(list[i]);
    }
  }
  if (city.edges && (x - r < 0 || y - r < 0 || x + r > city.width || y + r > city.height)) {
    for (const e of city.edges) out.push(e);
  }
  return out;
}

const _scratch = [];

/** True if a circle overlaps any solid - used to reject spawn points. */
function isBlocked(city, x, y, r) {
  const list = solidsNear(city, x, y, r, _scratch);
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const nx = clamp(x, s.x, s.x + s.w);
    const ny = clamp(y, s.y, s.y + s.h);
    const dx = x - nx;
    const dy = y - ny;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

/**
 * Push a circle out of every overlapping solid.
 * Returns the accumulated push (nx, ny) and the deepest penetration.
 */
function resolveCircle(city, p, r, hit) {
  const list = solidsNear(city, p.x, p.y, r, _scratch);
  hit.nx = 0;
  hit.ny = 0;
  hit.depth = 0;
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const nx = clamp(p.x, s.x, s.x + s.w);
    const ny = clamp(p.y, s.y, s.y + s.h);
    let dx = p.x - nx;
    let dy = p.y - ny;
    let d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;

    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      const push = r - d;
      dx /= d;
      dy /= d;
      p.x += dx * push;
      p.y += dy * push;
      hit.nx += dx * push;
      hit.ny += dy * push;
      if (push > hit.depth) hit.depth = push;
    } else {
      // Centre is inside the box: eject along the shallowest axis.
      const cx = s.x + s.w * 0.5;
      const cy = s.y + s.h * 0.5;
      const ox = s.w * 0.5 + r - Math.abs(p.x - cx);
      const oy = s.h * 0.5 + r - Math.abs(p.y - cy);
      if (ox < oy) {
        const dir = p.x < cx ? -1 : 1;
        p.x += ox * dir;
        hit.nx += ox * dir;
        if (ox > hit.depth) hit.depth = ox;
      } else {
        const dir = p.y < cy ? -1 : 1;
        p.y += oy * dir;
        hit.ny += oy * dir;
        if (oy > hit.depth) hit.depth = oy;
      }
    }
  }
  return hit;
}

/** A road-centre point near (x, y): handy for spawning things on tarmac. */
function nearestRoadPoint(city, x, y) {
  const c = city.cell;
  const cx = Math.round(x / c);
  const cy = Math.round(y / c);
  const onVertical = Math.abs(x - cx * c) < Math.abs(y - cy * c);
  return onVertical ? { x: cx * c, y } : { x, y: cy * c };
}

// ==================================================================
// js/pickups.js
// ==================================================================

// Vehicle upgrades scattered across the whole city, sitting out on the road
// waiting to be driven over. Each one is a timed modification to the car
// rather than a permanent one, so a run has a rhythm to it: you spend a while
// hunting for the next crate, then a while being briefly unstoppable.


const WIRE = 0;
const WHEELS = 1;
const FLAME = 2;

const PICKUP_KINDS = [
  {
    name: 'BARBED WIRE',
    blurb: 'they shred themselves on the bodywork',
    colour: '#9ad9e8',
    duration: 26,
  },
  {
    name: 'BIG WHEELS',
    blurb: 'a much wider path through them',
    colour: '#e8c04a',
    duration: 26,
  },
  {
    name: 'FLAMETHROWER',
    blurb: 'clears the road ahead every few seconds',
    colour: '#ff6a2f',
    duration: 24,
  },
];

const PICKUP_RADIUS = 17;
const COLLECT_RADIUS = 34;
/** Roughly one crate per this many blocks, spread over the whole map. */
const BLOCK_CHANCE = 0.2;
/** A replacement is placed at least this far away, so you have to go find it. */
const RESPAWN_MIN_DIST = 1600;

class PickupField {
  constructor(city, seed = 1) {
    this.city = city;
    this.rng = mulberry32((seed * 22695477) >>> 0);
    this.items = [];
    this.grid = new Map();
    this._q = [];
    this._scatter();
  }

  _key(x, y) {
    return Math.floor(x / CELL) * 8192 + Math.floor(y / CELL);
  }

  _index(p) {
    const k = this._key(p.x, p.y);
    let list = this.grid.get(k);
    if (list === undefined) this.grid.set(k, (list = []));
    list.push(p);
  }

  _deindex(p) {
    const list = this.grid.get(this._key(p.x, p.y));
    if (list === undefined) return;
    const i = list.indexOf(p);
    if (i >= 0) list.splice(i, 1);
  }

  /** A point out on the tarmac, clear of buildings. */
  _roadPoint(out) {
    const { city, rng } = this;
    for (let attempt = 0; attempt < 12; attempt++) {
      const cx = Math.floor(rng() * city.cols);
      const cy = Math.floor(rng() * city.rows);
      // Sit on one of the two streets bounding this block.
      const alongX = rng() < 0.5;
      const lane = rr(rng, -ROAD * 0.28, ROAD * 0.28);
      const x = alongX ? cx * CELL + rr(rng, -CELL * 0.4, CELL * 0.4) : cx * CELL + lane;
      const y = alongX ? cy * CELL + lane : cy * CELL + rr(rng, -CELL * 0.4, CELL * 0.4);
      if (x < ROAD || y < ROAD || x > city.width - ROAD || y > city.height - ROAD) continue;
      if (isBlocked(city, x, y, PICKUP_RADIUS + 6)) continue;
      out.x = x;
      out.y = y;
      return true;
    }
    return false;
  }

  _make(x, y, kind) {
    const p = { x, y, kind, alive: true, phase: this.rng() * TAU };
    this.items.push(p);
    this._index(p);
    return p;
  }

  _scatter() {
    const { city, rng } = this;
    const want = Math.round(city.cols * city.rows * BLOCK_CHANCE);
    const at = { x: 0, y: 0 };
    for (let i = 0; i < want; i++) {
      if (!this._roadPoint(at)) continue;
      this._make(at.x, at.y, Math.floor(rng() * PICKUP_KINDS.length));
    }
  }

  /** Keep the map stocked: a collected crate reappears somewhere far off. */
  _replace(awayFrom) {
    const at = { x: 0, y: 0 };
    for (let attempt = 0; attempt < 10; attempt++) {
      if (!this._roadPoint(at)) continue;
      const dx = at.x - awayFrom.x;
      const dy = at.y - awayFrom.y;
      if (dx * dx + dy * dy < RESPAWN_MIN_DIST * RESPAWN_MIN_DIST) continue;
      this._make(at.x, at.y, Math.floor(this.rng() * PICKUP_KINDS.length));
      return true;
    }
    return false;
  }

  get count() {
    return this.items.length;
  }

  /** Crates in the cells around a point, for drawing and for collection. */
  nearby(x, y, r, out) {
    out.length = 0;
    const x0 = Math.floor((x - r) / CELL);
    const x1 = Math.floor((x + r) / CELL);
    const y0 = Math.floor((y - r) / CELL);
    const y1 = Math.floor((y + r) / CELL);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const list = this.grid.get(cx * 8192 + cy);
        if (list === undefined) continue;
        for (let i = 0; i < list.length; i++) out.push(list[i]);
      }
    }
    return out;
  }

  /**
   * Bob the nearby crates and hand back whatever the car just drove over.
   * Returns an array of collected kinds (usually empty).
   */
  update(dt, car, collected) {
    collected.length = 0;
    const near = this.nearby(car.x, car.y, CELL, this._q);
    for (let i = 0; i < near.length; i++) {
      const p = near[i];
      if (!p.alive) continue;
      p.phase += dt * 2.2;
      const dx = p.x - car.x;
      const dy = p.y - car.y;
      if (dx * dx + dy * dy > COLLECT_RADIUS * COLLECT_RADIUS) continue;

      p.alive = false;
      this._deindex(p);
      const idx = this.items.indexOf(p);
      if (idx >= 0) this.items.splice(idx, 1);
      collected.push(p.kind);
      this._replace(car);
    }
    return collected;
  }
}

// ==================================================================
// js/touch.js
// ==================================================================

// Touch controls: a joystick that lives in the lower third of the screen and
// a gear button under the right thumb.
//
// The stick is directional rather than a pair of arrow keys - you push where
// you want the car to go and it steers itself there, which is the only thing
// that works with a thumb. The mapping from stick to controls is a pure
// function so it can be tested without a browser.

/** Push more than this far behind the car and you are asking for the brakes. */
const REVERSE_ARC = 2.36; // radians, 135 degrees
const DEADZONE = 0.18;
const STEER_GAIN = 2.4;

/** Hold the gear button this long and it becomes a burnout instead. */
const HOLD_FOR_BURNOUT = 0.3;
const STICK_RADIUS = 74;   // logical px from base to full deflection
const BUTTON_RADIUS = 52;

/**
 * Turn a stick deflection into throttle and steering.
 *   carAng  - the car's current heading
 *   speed   - signed speed along that heading, so we know if it is reversing
 *   sx, sy  - stick offset from its base, already normalised to 0..1
 */
function stickToInput(carAng, speed, sx, sy) {
  const mag = Math.hypot(sx, sy);
  if (mag < DEADZONE) return { throttle: 0, steer: 0, active: false };

  const m = clamp((mag - DEADZONE) / (1 - DEADZONE), 0, 1);
  const want = Math.atan2(sy, sx);
  const diff = angleDiff(carAng, want);

  if (Math.abs(diff) <= REVERSE_ARC) {
    // Pointing roughly where the nose already is: drive, steering into it.
    return { throttle: m, steer: clamp(diff * STEER_GAIN, -1, 1), active: true };
  }

  // Pointing back the way you came: brake, and once actually rolling backwards
  // steer so the *rear* of the car swings toward the stick.
  const back = angleDiff(carAng + Math.PI, want);
  const reversing = speed < -5;
  return {
    throttle: -m,
    steer: reversing
      ? clamp(-back * STEER_GAIN, -1, 1)
      : clamp(diff * STEER_GAIN, -1, 1),
    active: true,
  };
}

class TouchControls {
  constructor(target) {
    /** Only shown once we have seen a real touch, or a coarse pointer. */
    this.enabled = false;
    this.scale = 1;
    this.w = 0;
    this.h = 0;

    this.stick = { id: -1, down: false, baseX: 0, baseY: 0, dx: 0, dy: 0 };
    this.gear = { id: -1, x: 0, y: 0, r: BUTTON_RADIUS, down: false, heldFor: 0 };
    this.pause = { id: -1, x: 0, y: 0, r: 20, down: false };
    this.taps = { gear: false, pause: false };

    try {
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        this.enabled = true;
      }
    } catch { /* matchMedia missing: wait for a real touch instead */ }

    const opts = { passive: false };
    target.addEventListener('pointerdown', (e) => this._down(e), opts);
    target.addEventListener('pointermove', (e) => this._move(e), opts);
    target.addEventListener('pointerup', (e) => this._up(e), opts);
    target.addEventListener('pointercancel', (e) => this._up(e), opts);
    target.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** Holding the gear button down, rather than tapping it, does a burnout. */
  get burnout() {
    return this.enabled && this.gear.down && this.gear.heldFor > HOLD_FOR_BURNOUT;
  }

  /** Position the controls for the current screen, in logical HUD units. */
  layout(uw, uh, scale) {
    this.w = uw;
    this.h = uh;
    this.scale = scale;
    this.restX = Math.max(150, uw * 0.14);
    this.restY = uh - Math.max(130, uh * 0.19);
    this.gear.x = uw - Math.max(110, uw * 0.09);
    this.gear.y = uh - Math.max(115, uh * 0.17);
    // Top centre: the corners are taken by the stats and the minimap. On a
    // narrow screen centre would sit on the chassis bar, so keep clear of it.
    const statsRight = 24 + 250 + 34;
    this.pause.x = Math.max(uw / 2, statsRight);
    this.pause.y = 32;
    if (!this.stick.down) {
      this.stick.baseX = this.restX;
      this.stick.baseY = this.restY;
    }
  }

  /** Where the lower third - the joystick's home - starts. */
  get zoneTop() {
    return this.h * (2 / 3);
  }

  _point(e) {
    return { x: e.clientX / this.scale, y: e.clientY / this.scale };
  }

  _hit(btn, p) {
    const dx = p.x - btn.x;
    const dy = p.y - btn.y;
    return dx * dx + dy * dy <= btn.r * btn.r;
  }

  _down(e) {
    if (e.pointerType === 'touch') this.enabled = true;
    if (!this.enabled) return;
    const p = this._point(e);

    if (this._hit(this.gear, p)) {
      e.preventDefault();
      this.gear.id = e.pointerId;
      this.gear.down = true;
      this.taps.gear = true;
      return;
    }
    if (this._hit(this.pause, p)) {
      e.preventDefault();
      this.pause.id = e.pointerId;
      this.pause.down = true;
      this.taps.pause = true;
      return;
    }
    // Anywhere in the lower third plants the stick under your thumb.
    if (p.y >= this.zoneTop && !this.stick.down) {
      e.preventDefault();
      this.stick.id = e.pointerId;
      this.stick.down = true;
      this.stick.baseX = p.x;
      this.stick.baseY = p.y;
      this.stick.dx = 0;
      this.stick.dy = 0;
    }
  }

  _move(e) {
    if (!this.enabled || e.pointerId !== this.stick.id || !this.stick.down) return;
    e.preventDefault();
    const p = this._point(e);
    let dx = p.x - this.stick.baseX;
    let dy = p.y - this.stick.baseY;
    const d = Math.hypot(dx, dy);
    if (d > STICK_RADIUS) {
      // Let the base follow a thumb that has run past the edge, so the stick
      // never gets stuck at full lock in a direction you have left behind.
      this.stick.baseX += dx * (1 - STICK_RADIUS / d);
      this.stick.baseY += dy * (1 - STICK_RADIUS / d);
      dx *= STICK_RADIUS / d;
      dy *= STICK_RADIUS / d;
    }
    this.stick.dx = dx;
    this.stick.dy = dy;
  }

  _up(e) {
    if (e.pointerId === this.stick.id) {
      this.stick.down = false;
      this.stick.id = -1;
      this.stick.dx = 0;
      this.stick.dy = 0;
      this.stick.baseX = this.restX;
      this.stick.baseY = this.restY;
    }
    if (e.pointerId === this.gear.id) {
      this.gear.down = false;
      this.gear.id = -1;
    }
    if (e.pointerId === this.pause.id) {
      this.pause.down = false;
      this.pause.id = -1;
    }
  }

  /** Advance button hold timers. */
  tick(dt) {
    if (this.gear.down) this.gear.heldFor += dt;
    else this.gear.heldFor = 0;
  }

  /** Current throttle and steering, given what the car is doing. */
  read(car) {
    const burning = this.burnout;
    if (!this.enabled || (!this.stick.down && !burning)) {
      return { throttle: 0, steer: 0, active: burning, burnout: burning };
    }
    const r = this.stick.down
      ? stickToInput(car.ang, car.speed, this.stick.dx / STICK_RADIUS, this.stick.dy / STICK_RADIUS)
      : { throttle: 0, steer: 0, active: true };
    // While burning out the stick only steers - the throttle is pinned.
    return { throttle: burning ? 0 : r.throttle, steer: r.steer, active: true, burnout: burning };
  }

  /** Button presses since the last call. */
  consumeTaps() {
    const out = { gear: this.taps.gear, pause: this.taps.pause };
    this.taps.gear = false;
    this.taps.pause = false;
    return out;
  }
}

// ==================================================================
// js/car.js
// ==================================================================

// Pure arcade car physics. No canvas, no DOM - the headless tests drive this
// directly to check that the gearbox behaves the way the design wants.

const GEAR_LOW = 0;
const GEAR_HIGH = 1;

const CAR_LENGTH = 62;
const CAR_WIDTH = 30;

/**
 * World units are pixels. These fix the one scale the HUD reports in, so the
 * speedometer and the distance readout agree with each other:
 * 62px of car ~ 3.3m, and a 660px/s top speed ~ 125km/h.
 */
const KMH_PER_PX = 0.19;
const PX_PER_METRE = 18.95;

/**
 * LOW  - little top speed but full torque from a standstill, so it can drag
 *        the car out of a swarm that has bogged it down.
 * HIGH - long legs and a high top speed, but almost no torque down low: get
 *        stopped by a crowd in high gear and you are not getting going again.
 */
const GEARS = [
  { name: 'LOW',  maxSpeed: 235, force: 900, turn: 3.5, grip: 13, torqueFloor: 1.0,  torqueKnee: 1 },
  { name: 'HIGH', maxSpeed: 660, force: 620, turn: 2.4, grip: 8.5, torqueFloor: 0.22, torqueKnee: 220 },
];

const REVERSE_SPEED = 130;
/** Acceleration applied per unit of crowd pressure (pressure 1 = fully mobbed). */
const CROWD_DRAG = 640;
/** Grip lost on a road slick with blood, at full depth. */
const TRACTION_LOSS = 0.58;

function createCar(x, y, ang = 0) {
  return {
    x, y, ang,
    vx: 0, vy: 0,
    gear: GEAR_HIGH,
    speed: 0,        // signed, along the heading
    rpm: 0,          // 0..1, for the engine note and the tacho
    steer: 0,        // smoothed steering input
    lastImpact: 0,   // speed lost to the most recent wall hit
    wheelspin: 0,    // 0..1, how much the tyres are losing to the road
    tyreBlood: 0,    // 0..1, how much blood the tyres are carrying
  };
}

function shiftGear(car, gear) {
  if (car.gear === gear) return false;
  car.gear = gear;
  return true;
}

function toggleGear(car) {
  car.gear = car.gear === GEAR_LOW ? GEAR_HIGH : GEAR_LOW;
  return car.gear;
}

/** Fraction of peak engine force available at the current speed. */
function torqueAt(gear, speed) {
  const g = GEARS[gear];
  return clamp(g.torqueFloor + (1 - g.torqueFloor) * (speed / g.torqueKnee), 0, 1);
}

/**
 * Advance the car one step.
 *   input: { throttle: -1..1, steer: -1..1, burnout: bool }
 *   env:   { crowd: swarm pressure, gore: gore drag, slip: 0..1 blood depth }
 */
function updateCar(car, input, dt, env) {
  const g = GEARS[car.gear];
  const crowd = env && env.crowd ? env.crowd : 0;
  const gore = env && env.gore ? env.gore : 0;
  const slip = env && env.slip ? clamp(env.slip, 0, 1) : 0;
  const burnout = !!(input && input.burnout);

  const cos = Math.cos(car.ang);
  const sin = Math.sin(car.ang);

  // Split velocity into forward / lateral so we can apply grip to the slide.
  let fwd = car.vx * cos + car.vy * sin;
  let lat = -car.vx * sin + car.vy * cos;

  const throttle = clamp(input.throttle || 0, -1, 1);

  let accel = 0;
  let spin = 0;
  if (burnout) {
    // Throttle and brake together: the brakes hold the car while the engine
    // lights the tyres up. Barely moves, spins like mad, and on a wet road
    // throws a great deal of blood about.
    spin = 1;
    accel = (45 - fwd) * 6;
  } else if (throttle > 0) {
    const torque = torqueAt(car.gear, Math.max(0, fwd));
    const headroom = 1 - Math.pow(clamp(fwd / g.maxSpeed, 0, 1), 1.6);
    const demand = g.force * torque * headroom * throttle;
    // What the tyres can actually put down. Blood costs you most of it, and
    // low gear has the torque to break traction where high gear does not.
    const hold = g.force * (1 - TRACTION_LOSS * slip);
    if (demand > hold) {
      spin = clamp((demand - hold) / g.force, 0, 1);
      accel = hold;
    } else {
      accel = demand;
    }
  } else if (throttle < 0) {
    // Brake hard while rolling forward, then creep backwards.
    accel = fwd > 12 ? -1500 * -throttle : -520 * -throttle;
    if (fwd < -REVERSE_SPEED) accel = 0;
  }

  // Rolling resistance plus whatever is currently clogging the wheels.
  const resist = 0.55 * fwd + sign(fwd) * (crowd * CROWD_DRAG + gore * 260);
  fwd += (accel - resist) * dt;

  // Crowd pressure also caps outright top speed, so a thick mob is a wall.
  const cap = g.maxSpeed * (1 - 0.55 * clamp(crowd, 0, 1));
  if (fwd > cap) fwd += (cap - fwd) * Math.min(1, dt * 4);
  if (fwd < -REVERSE_SPEED) fwd = -REVERSE_SPEED;
  if (Math.abs(fwd) < 1.5 && throttle === 0) fwd = 0;

  car.wheelspin += (spin - car.wheelspin) * Math.min(1, dt * 9);

  // Tyres scrub off sideways velocity; less grip when the crowd is shoving,
  // and much less on blood or with the wheels already spinning.
  const gripLoss = clamp(0.55 * slip + 0.45 * car.wheelspin, 0, 0.82);
  lat -= lat * Math.min(1, g.grip * (1 - gripLoss) * dt * (1 - 0.35 * clamp(crowd, 0, 1)));

  // Steering authority falls away at very low and very high speed.
  const target = clamp(input.steer || 0, -1, 1);
  car.steer += (target - car.steer) * Math.min(1, dt * 12);
  // Steering needs some speed to bite - except in a burnout, where the point
  // is to be able to swing the car round on the spot.
  const gripSpeed = Math.max(clamp(Math.abs(fwd) / 90, 0, 1), burnout ? 0.9 : 0);
  const fast = 1 - 0.45 * clamp(Math.abs(fwd) / g.maxSpeed, 0, 1);
  const dAng = car.steer * g.turn * gripSpeed * fast * sign(fwd || 1) * dt;
  car.ang += dAng;
  if (car.ang > Math.PI) car.ang -= TAU;
  if (car.ang < -Math.PI) car.ang += TAU;

  // Put the velocity back into world space in the heading we started with...
  const wvx = fwd * cos - lat * sin;
  const wvy = fwd * sin + lat * cos;

  // ...then swing the momentum round after the nose only as far as the tyres
  // can drag it. With full grip it follows exactly and the car goes where it
  // points; on blood the nose comes round while the car keeps sliding the way
  // it was already going, which is what makes a slick road feel slick.
  const rot = dAng * (1 - gripLoss);
  const cr = Math.cos(rot);
  const sr = Math.sin(rot);
  car.vx = wvx * cr - wvy * sr;
  car.vy = wvx * sr + wvy * cr;

  car.x += car.vx * dt;
  car.y += car.vy * dt;
  car.speed = car.vx * Math.cos(car.ang) + car.vy * Math.sin(car.ang);

  const targetRpm = clamp(Math.abs(fwd) / g.maxSpeed, 0, 1) * 0.8 + (throttle > 0 ? 0.2 : 0.05);
  car.rpm += (targetRpm - car.rpm) * Math.min(1, dt * 6);
  return car;
}

/**
 * Bleed speed when the car body hits something solid.
 * A grazing scrape only cancels the velocity going into the wall, so you can
 * slide along a building; a square-on hit scrubs most of your momentum.
 * Returns the speed lost, which the caller turns into damage and shake.
 */
function applyImpact(car, nx, ny) {
  const len = Math.hypot(nx, ny);
  if (len < 1e-5) return 0;
  nx /= len;
  ny /= len;
  const into = car.vx * nx + car.vy * ny; // negative when driving into the wall
  if (into >= 0) return 0;
  const lost = -into;

  // Cancel the component going into the wall, with a little bounce back.
  const restitution = 0.18;
  car.vx -= nx * into * (1 + restitution);
  car.vy -= ny * into * (1 + restitution);

  // Scrub tangential speed in proportion to how hard the hit was.
  const scrub = clamp(lost / 320, 0, 1) * 0.55;
  car.vx *= 1 - scrub;
  car.vy *= 1 - scrub;

  car.speed = car.vx * Math.cos(car.ang) + car.vy * Math.sin(car.ang);
  car.lastImpact = lost;
  return lost;
}

/**
 * Circle-vs-oriented-box test used for running things over. `widthScale`
 * widens the crush footprint without widening the car itself, which is what
 * the big wheels do: a broader path through the horde, same body to squeeze
 * down the same streets.
 */
function overlapsCar(car, x, y, r, widthScale = 1) {
  const dx = x - car.x;
  const dy = y - car.y;
  const cos = Math.cos(car.ang);
  const sin = Math.sin(car.ang);
  const lx = dx * cos + dy * sin;
  const ly = -dx * sin + dy * cos;
  return Math.abs(lx) < CAR_LENGTH * 0.5 + r && Math.abs(ly) < CAR_WIDTH * 0.5 * widthScale + r;
}

/** World-space point of the two collision circles approximating the body. */
function bodyCircle(car, which, out) {
  const off = which === 0 ? CAR_LENGTH * 0.26 : -CAR_LENGTH * 0.26;
  out.x = car.x + Math.cos(car.ang) * off;
  out.y = car.y + Math.sin(car.ang) * off;
  return out;
}
const BODY_RADIUS = CAR_WIDTH * 0.55;

// The horde. Thousands of agents, so everything here is written for the
// common case: pooled objects, a rebuilt spatial hash, capped neighbour scans
// and a cheap update tier for anything far off screen.



const ZOMBIE = 0;
const SKELETON = 1;

/**
 * Zombies are heavy and slow: they clog the car and are the source of the
 * thick gore. Skeletons are quick and brittle - they die at lower speed but
 * they get to you first and claw harder.
 */
const KINDS = [
  { name: 'zombie',   radius: 9,   speed: [42, 74],  killSpeed: 88, mass: 1.0, damage: 3.2, drag: 1.0, gore: 10 },
  { name: 'skeleton', radius: 7.5, speed: [86, 128], killSpeed: 52, mass: 0.55, damage: 5.0, drag: 0.6, gore: 6 },
];

const ACTIVE_RADIUS = 1750;   // full-rate AI inside this radius of the car
const DESPAWN_RADIUS = 2900;
const SPAWN_MIN = 820;
const SPAWN_MAX = 1360;
const MAX_ENEMIES = 2600;
const SEPARATION_R = 24;
const MAX_NEIGHBOURS = 10;

class Swarm {
  constructor(city, seed = 1) {
    this.city = city;
    this.rng = mulberry32((seed * 2654435761) >>> 0);
    this.hash = new SpatialHash(32);
    this.pool = new Array(MAX_ENEMIES);
    this.free = [];
    this.active = [];
    for (let i = 0; i < MAX_ENEMIES; i++) {
      this.pool[i] = {
        i, alive: false, x: 0, y: 0, vx: 0, vy: 0, ang: 0,
        r: 9, kind: ZOMBIE, spd: 50, phase: 0, wob: 0, stun: 0,
      };
      this.free.push(this.pool[i]);
    }
    this._q = [];
    this._hit = { nx: 0, ny: 0, depth: 0 };
    this._tick = 0;
    this.hordeTimer = 6;
  }

  get count() { return this.active.length; }

  reset() {
    for (const e of this.active) e.alive = false;
    this.active.length = 0;
    this.free.length = 0;
    for (let i = 0; i < this.pool.length; i++) this.free.push(this.pool[i]);
    this.hordeTimer = 6;
  }

  spawn(x, y, kind) {
    const e = this.free.pop();
    if (e === undefined) return null;
    const k = KINDS[kind];
    e.alive = true;
    e.x = x;
    e.y = y;
    e.vx = 0;
    e.vy = 0;
    e.kind = kind;
    e.r = k.radius;
    e.spd = rr(this.rng, k.speed[0], k.speed[1]);
    e.ang = rr(this.rng, 0, TAU);
    e.phase = rr(this.rng, 0, TAU);
    e.wob = rr(this.rng, 0.6, 1.6);
    e.stun = 0;
    this.active.push(e);
    return e;
  }

  kill(e) {
    e.alive = false;
    const idx = this.active.indexOf(e);
    if (idx >= 0) {
      this.active[idx] = this.active[this.active.length - 1];
      this.active.pop();
    }
    this.free.push(e);
  }

  /**
   * Find a spawn point on open ground in a ring around the car. Spawns are
   * biased toward `heading` so the street you are driving down is always
   * filling up ahead of you instead of emptying out behind.
   */
  _spawnPoint(tx, ty, out, heading) {
    for (let attempt = 0; attempt < 8; attempt++) {
      const a = heading !== undefined && this.rng() < 0.72
        ? heading + rr(this.rng, -0.85, 0.85)
        : this.rng() * TAU;
      const d = rr(this.rng, SPAWN_MIN, SPAWN_MAX);
      const x = tx + Math.cos(a) * d;
      const y = ty + Math.sin(a) * d;
      if (x < 40 || y < 40 || x > this.city.width - 40 || y > this.city.height - 40) continue;
      if (isBlocked(this.city, x, y, 12)) continue;
      out.x = x;
      out.y = y;
      return true;
    }
    return false;
  }

  /**
   * `difficulty` is 0..1 and drives both how many of them there are and how
   * many of those are skeletons.
   */
  update(dt, target, difficulty) {
    const city = this.city;
    const rng = this.rng;
    this._tick++;

    // ---- population -------------------------------------------------
    const want = Math.min(MAX_ENEMIES, Math.round(430 + 2100 * difficulty));
    const skelChance = 0.06 + 0.42 * difficulty;
    const p = { x: 0, y: 0 };
    const moving = Math.hypot(target.vx, target.vy) > 70;
    const heading = moving ? Math.atan2(target.vy, target.vx) : undefined;
    let budget = 40;
    while (this.active.length < want && budget-- > 0) {
      if (!this._spawnPoint(target.x, target.y, p, heading)) break;
      this.spawn(p.x, p.y, rng() < skelChance ? SKELETON : ZOMBIE);
    }

    // Occasional tight cluster dumped into the street: a proper wall of them.
    this.hordeTimer -= dt;
    if (this.hordeTimer <= 0) {
      this.hordeTimer = rr(rng, 9, 17) * (1 - 0.4 * difficulty);
      if (this._spawnPoint(target.x, target.y, p, heading)) {
        const n = Math.round(rr(rng, 30, 70) * (0.5 + difficulty));
        for (let i = 0; i < n; i++) {
          const a = rng() * TAU;
          const d = Math.sqrt(rng()) * rr(rng, 60, 190);
          const x = p.x + Math.cos(a) * d;
          const y = p.y + Math.sin(a) * d;
          if (isBlocked(city, x, y, 10)) continue;
          this.spawn(x, y, rng() < skelChance ? SKELETON : ZOMBIE);
        }
      }
    }

    // ---- rebuild the hash -------------------------------------------
    this.hash.clear();
    const act = this.active;
    for (let i = 0; i < act.length; i++) this.hash.insert(act[i].x, act[i].y, act[i]);

    // ---- steering ----------------------------------------------------
    const q = this._q;
    const activeR2 = ACTIVE_RADIUS * ACTIVE_RADIUS;
    const despawn2 = DESPAWN_RADIUS * DESPAWN_RADIUS;
    const slowPhase = this._tick % 6;

    for (let i = act.length - 1; i >= 0; i--) {
      const e = act[i];
      const dx = target.x - e.x;
      const dy = target.y - e.y;
      const d2 = dx * dx + dy * dy;

      if (d2 > despawn2) {
        if (act.length > want * 0.85) this.kill(e);
        continue;
      }

      let step = dt;
      if (d2 > activeR2) {
        // Far away: think once every six frames with a six-times-longer step.
        if (e.i % 6 !== slowPhase) continue;
        step = dt * 6;
      }

      const d = Math.sqrt(d2) || 1;
      const k = KINDS[e.kind];

      let ax = dx / d;
      let ay = dy / d;

      // Shambling wobble so a mass of them does not move as one rigid blob.
      e.phase += step * (2.4 + e.wob);
      const wob = Math.sin(e.phase) * 0.28 * e.wob;
      const wx = ax * Math.cos(wob) - ay * Math.sin(wob);
      const wy = ax * Math.sin(wob) + ay * Math.cos(wob);
      ax = wx;
      ay = wy;

      // Separation - the reason a swarm has a surface instead of a singularity.
      if (d2 < activeR2) {
        this.hash.query(e.x, e.y, SEPARATION_R, q);
        let sx = 0;
        let sy = 0;
        let n = 0;
        for (let j = 0; j < q.length && n < MAX_NEIGHBOURS; j++) {
          const o = q[j];
          if (o === e) continue;
          const ox = e.x - o.x;
          const oy = e.y - o.y;
          const od2 = ox * ox + oy * oy;
          const min = e.r + o.r;
          if (od2 > min * min || od2 < 1e-6) continue;
          const od = Math.sqrt(od2);
          const w = (min - od) / min;
          sx += (ox / od) * w;
          sy += (oy / od) * w;
          n++;
        }
        if (n > 0) {
          ax += sx * 2.6;
          ay += sy * 2.6;
        }
      }

      const al = Math.hypot(ax, ay) || 1;
      let spd = e.spd;
      if (e.stun > 0) {
        e.stun -= step;
        spd *= 0.25;
      }

      // Knockback velocity decays; steering blends in on top of it.
      e.vx += ((ax / al) * spd - e.vx) * Math.min(1, step * 6);
      e.vy += ((ay / al) * spd - e.vy) * Math.min(1, step * 6);
      e.x += e.vx * step;
      e.y += e.vy * step;
      e.ang = Math.atan2(e.vy, e.vx);

      resolveCircle(city, e, e.r, this._hit);
    }
  }

  /** Enemies whose cells overlap the circle. */
  query(x, y, r, out) {
    return this.hash.query(x, y, r, out);
  }

  /** Shove nearby enemies away from a point - used when the car ploughs in. */
  knockback(x, y, radius, power) {
    const q = this.hash.query(x, y, radius, this._q);
    for (let i = 0; i < q.length; i++) {
      const e = q[i];
      const dx = e.x - x;
      const dy = e.y - y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > radius) continue;
      const f = (1 - d / radius) * power;
      e.vx += (dx / d) * f;
      e.vy += (dy / d) * f;
      e.stun = Math.max(e.stun, 0.25);
    }
  }
}

// Gore chunks are real, movable little bodies rather than decals, because the
// whole point is that you can plough through a pile and shove it aside.
//
// Cost is kept down by parking settled chunks: once a chunk stops moving it
// is skipped entirely until the car (or another chunk) disturbs it again.



const MAX_CHUNKS = 4600;

const MEAT = 0;
const BONE = 1;
const CHAR = 2;

class GoreField {
  constructor(seed = 1) {
    this.rng = mulberry32((seed * 40503) >>> 0);
    this.hash = new SpatialHash(28);
    this.chunks = new Array(MAX_CHUNKS);
    for (let i = 0; i < MAX_CHUNKS; i++) {
      this.chunks[i] = {
        live: false, x: 0, y: 0, vx: 0, vy: 0, r: 5, rot: 0, spin: 0,
        type: MEAT, tone: 0, shape: 0, moving: false, age: 0,
      };
    }
    this.head = 0;      // ring-buffer cursor: oldest gore is recycled first
    this.live = 0;
    /** Splats waiting to be baked into the renderer's decal layer. */
    this.splats = [];
    this._q = [];
  }

  reset() {
    for (const c of this.chunks) c.live = false;
    this.head = 0;
    this.live = 0;
    this.splats.length = 0;
  }

  _next() {
    const c = this.chunks[this.head];
    this.head = (this.head + 1) % MAX_CHUNKS;
    if (!c.live) this.live++;
    c.live = true;
    return c;
  }

  /**
   * Burst one enemy into chunks, thrown along the direction it was hit from.
   * `power` is roughly the car's speed - faster hits spray further.
   */
  burst(x, y, dirx, diry, power, kind, amount) {
    const rng = this.rng;
    const spread = clamp(power / 260, 0.25, 1.6);
    for (let i = 0; i < amount; i++) {
      const c = this._next();
      const a = Math.atan2(diry, dirx) + rr(rng, -0.9, 0.9);
      const sp = rr(rng, 40, 240) * spread;
      c.x = x + rr(rng, -6, 6);
      c.y = y + rr(rng, -6, 6);
      c.vx = Math.cos(a) * sp;
      c.vy = Math.sin(a) * sp;
      c.r = kind === MEAT ? rr(rng, 5, 13) : rr(rng, 3.2, 7);
      c.rot = rr(rng, 0, TAU);
      c.spin = rr(rng, -6, 6);
      c.type = kind;
      c.tone = rng();
      c.shape = Math.floor(rng() * 4);
      c.moving = true;
      c.age = 0;
    }
    if (this.splats.length > 512) this.splats.shift();
    this.splats.push({
      x, y,
      r: (kind === MEAT ? 40 : 25) + power * 0.07,
      tone: this.rng(),
      kind,
      dirx, diry,
      power,
    });
  }

  /** Rebuild the hash and step every chunk that is still in motion. */
  update(dt) {
    this.hash.clear();
    const arr = this.chunks;
    for (let i = 0; i < arr.length; i++) {
      const c = arr[i];
      if (!c.live) continue;
      this.hash.insert(c.x, c.y, c);
      if (!c.moving) continue;

      c.age += dt;
      const fr = Math.exp(-7.5 * dt);
      c.vx *= fr;
      c.vy *= fr;
      c.rot += c.spin * dt;
      c.spin *= fr;
      c.x += c.vx * dt;
      c.y += c.vy * dt;

      if (c.vx * c.vx + c.vy * c.vy < 36) {
        c.vx = 0;
        c.vy = 0;
        c.spin = 0;
        c.moving = false;
      }
    }

    // Moving chunks shoulder settled ones aside, so a shoved pile spreads
    // outwards instead of everything piling onto one point.
    const q = this._q;
    for (let i = 0; i < arr.length; i++) {
      const c = arr[i];
      if (!c.live || !c.moving) continue;
      this.hash.query(c.x, c.y, c.r * 2, q);
      let n = 0;
      for (let j = 0; j < q.length && n < 6; j++) {
        const o = q[j];
        if (o === c || !o.live) continue;
        const dx = o.x - c.x;
        const dy = o.y - c.y;
        const d2 = dx * dx + dy * dy;
        const min = (c.r + o.r) * 0.8;
        if (d2 > min * min || d2 < 1e-6) continue;
        const d = Math.sqrt(d2);
        const push = (min - d) / min;
        o.x += (dx / d) * push * 1.4;
        o.y += (dy / d) * push * 1.4;
        o.vx += (dx / d) * push * 26;
        o.vy += (dy / d) * push * 26;
        o.moving = true;
        n++;
      }
    }
  }

  /**
   * Shove chunks out of the car's footprint and report how clogged the car is.
   * Returns 0..1 gore drag.
   */
  plough(car, widthScale = 1) {
    const cos = Math.cos(car.ang);
    const sin = Math.sin(car.ang);
    const speed = Math.abs(car.speed);
    const reach = CAR_LENGTH * 0.7;
    const q = this.hash.query(car.x, car.y, reach + 14 + CAR_WIDTH * (widthScale - 1), this._q);
    let touching = 0;

    for (let i = 0; i < q.length; i++) {
      const c = q[i];
      if (!c.live) continue;
      const dx = c.x - car.x;
      const dy = c.y - car.y;
      const lx = dx * cos + dy * sin;
      const ly = -dx * sin + dy * cos;
      const hx = CAR_LENGTH * 0.5 + c.r;
      const hy = CAR_WIDTH * 0.5 * widthScale + c.r;
      if (Math.abs(lx) > hx || Math.abs(ly) > hy) continue;

      touching++;
      // Eject sideways: that is what leaves clean wheel tracks through a pile.
      const side = ly >= 0 ? 1 : -1;
      const out = hy - Math.abs(ly) + 0.5;
      const px = -sin * side;
      const py = cos * side;
      c.x += px * out;
      c.y += py * out;
      const force = 60 + speed * 0.55;
      c.vx += px * force + cos * car.speed * 0.06;
      c.vy += py * force + sin * car.speed * 0.06;
      c.spin += (this.rng() - 0.5) * 12;
      c.moving = true;
    }
    return clamp(touching / 26, 0, 1);
  }
}
